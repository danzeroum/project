name: release

# Uma release do molde nasce SÓ daqui, e só de push de tag vX.Y.Z.
#
# A ordem dos passos é a decisão inteira: valida-se primeiro, publica-se depois. Um workflow que
# publicasse antes de validar produziria a categoria "release com validação vermelha" — e categoria
# que existe acaba sendo usada, normalmente no dia em que alguém tem pressa.
#
# O que este workflow NÃO faz, deliberadamente: criar a tag. A tag é criada por quem decide
# publicar, e o workflow a AUDITA. Um workflow que criasse a própria tag que ele valida seria o
# vigiado assinando o próprio atestado.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: verify_chain precisa do PAI do commit de release para conferir que a
      # release não acrescenta nada além do manifesto. Com clone raso não há pai, e o elo viraria
      # indeterminação permanente — indeterminação que nunca resolve é trava desligada.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ferramentas de validação
        run: pip install "jsonschema>=4" "pyyaml>=6" "pytest>=8"

      # ------------------------------------------------------------------------------------
      # (1) Tag só nasce de commit validado. Este passo é o significado único de "validado"
      # (princípio (c) do plano): a mesma linha que o governance.yml roda, nem mais fraca nem
      # diferente. O manifesto declara este comando como const no schema justamente para que
      # afrouxá-lo aqui não passe despercebido.
      # ------------------------------------------------------------------------------------
      - name: Validação total do projeto
        run: python ci/validate_all.py

      - name: Testes dos fiscais
        run: pytest tests/governance -q

      # ------------------------------------------------------------------------------------
      # (2) A cadeia inteira: tag → commit → manifesto na árvore → hash → pai validado →
      # commit de release sem carona. Falha aqui é ausência de release, nunca release parcial.
      # ------------------------------------------------------------------------------------
      - name: Verificar a cadeia da release
        run: python ci/mold_release.py --verify-tag "${GITHUB_REF_NAME}"

      # ------------------------------------------------------------------------------------
      # (3) Tag móvel = ausência de release. Uma tag reescrita apontaria para outro conteúdo com
      # o mesmo nome, e todo derivado que a cita passaria a afirmar ter nascido de algo que nunca
      # existiu. A trava real é a proteção de tag administrada fora deste workflow; este passo é a
      # detecção — ele acusa a divergência entre o que a tag anotada registrou e o que ela aponta.
      # ------------------------------------------------------------------------------------
      - name: Recusar tag movida
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          alvo=$(git rev-list -n 1 "$tag")
          if [ "$alvo" != "${GITHUB_SHA}" ]; then
            echo "::error::a tag $tag aponta para $alvo e o evento carrega ${GITHUB_SHA} — tag movida é ausência de release."
            exit 1
          fi
          echo "tag $tag → $alvo (imóvel neste run)"
