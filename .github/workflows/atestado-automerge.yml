name: atestado — auto-merge

# O PR diário da autoridade externa mergeia sem humano — e SÓ ele.
#
# Desde a CP-036 o atestado vale 25h e o molde bloqueia quando ele vence. O cron da autoridade
# abre um PR por dia; exigir um clique humano nele daria à trava um gargalo diário, que é como
# trava boa vira trava contornada (princípio (e)).
#
# `pull_request_target` E NÃO `pull_request`, e a escolha é a segurança inteira deste workflow:
# com `pull_request_target` o YAML executado vem da BASE, nunca do head do PR. Com
# `pull_request`, um PR que alterasse este arquivo rodaria a versão alterada — as próprias
# checagens que decidem se ele pode auto-mergear seriam escritas por ele. Nenhum passo abaixo faz
# checkout do head nem executa uma linha vinda dele: o que se lê do PR é metadado da API (autor e
# lista de arquivos), nunca código.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  portao:
    runs-on: ubuntu-latest
    steps:
      # A BASE. Sem `ref:`, o checkout de pull_request_target traz a branch de destino — que é
      # exatamente o que se quer: o fiscal e a declaração vêm de onde o PR não alcança.
      - name: Trazer o molde na BASE (nunca o head do PR)
        uses: actions/checkout@v4

      # 3.11, como todo workflow desta casa — e a razão mora numa propriedade de
      # requirements-ci.txt que não estava escrita em lugar nenhum: o lockfile carrega UM hash por
      # pacote, o do wheel daquela versão de interpretador. Pedir 3.12 baixa o wheel cp312, cujo
      # hash não é o listado, e o pip aborta com "THESE PACKAGES DO NOT MATCH THE HASHES" antes de
      # o portão rodar uma linha. Foi assim aqui até 05/08/2026, e quem descobriu foi o primeiro
      # derivado a copiar o padrão — este workflow ainda não tinha disparado nenhuma vez.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements-ci.txt

      # Metadado, não código: a lista de caminhos vem da API do GitHub. Um `git diff` contra o
      # head exigiria trazer o head para o runner, que é a coisa que este workflow não faz.
      - name: Listar o que o PR toca
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --json files \
            --jq '.files[].path' > arquivos.txt
          echo "arquivos no diff:"; cat arquivos.txt

      # AS TRÊS CONDIÇÕES, num núcleo puro e testável fora do GitHub. Recusar aqui NÃO reprova o
      # PR: um PR humano que toca o atestado é legítimo, só não é auto-mergeável.
      - name: Decidir se este PR é auto-mergeável
        id: portao
        run: python ci/automerge_gate.py --arquivos arquivos.txt

      # A TERCEIRA CONDIÇÃO — os checks — não é conferida aqui, e não é esquecimento: quem a
      # confere é o auto-merge NATIVO do GitHub, que segura o merge até os required status checks
      # e o ruleset passarem. Conferir checks neste passo seria conferir um estado que ainda vai
      # mudar, e depois mergear por conta própria com base nele.
      #
      # `--auto`, e nunca a variante administrativa que atropela o ruleset — o ruleset é a única
      # coisa deste desenho que o conteúdo de um PR não alcança. O nome dessa flag NÃO é escrito
      # aqui de propósito: a asserção que a proíbe procura o literal no arquivo inteiro,
      # comentários inclusive, e uma trava que o próprio comentário dispara é uma trava que alguém
      # aprende a afrouxar. O ADR-029 a nomeia por extenso, que é onde ela deve ser explicada.
      - name: Habilitar o auto-merge NATIVO
        if: steps.portao.outputs.liberar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr merge "${{ github.event.pull_request.number }}" \
               --repo "${{ github.repository }}" --auto --merge 2>erro.txt; then
            echo "::notice::auto-merge habilitado — o GitHub mergeia quando os checks obrigatórios passarem."
            exit 0
          fi
          cat erro.txt

          # DUAS FALHAS DIFERENTES, DUAS REAÇÕES (princípio (h)) — e a distinção veio de um achado
          # real: a configuração está desabilitada HOJE neste repositório.
          #
          # "Allow auto-merge desmarcado" não é defeito deste PR nem deste workflow: é uma
          # capacidade que falta no ambiente, e o fallback dela é o estado de ontem — o PR diário
          # integrado à mão. Reprovar o job aqui pintaria de vermelho TODO PR de atestado até
          # alguém marcar a caixa, e vermelho permanente é exatamente como um fiscal se torna
          # ignorado (ADR-019). O aviso é alto, tem a ação exata, e o job segue verde.
          #
          # Qualquer outro erro é outro assunto — token sem escopo, PR em estado inesperado, API
          # fora — e esses reprovam, porque significam que o desenho não fez o que promete.
          if grep -qiE "auto.merge is not allowed|auto.merge is not enabled|allow auto.merge" erro.txt; then
            echo "::warning::o auto-merge nativo está DESABILITADO neste repositório, então este PR fica para integração MANUAL — que é o comportamento anterior à CP-037, não um estado pior. Ação de admin (uma caixa): Settings → General → Pull Requests → marcar 'Allow auto-merge'."
            exit 0
          fi
          echo "::error::o auto-merge não pôde ser habilitado por um motivo que NÃO é a configuração do repositório — ver o erro acima."
          exit 1
