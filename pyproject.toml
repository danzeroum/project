[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project"
version = "0.1.0"
description = "Carcaça de projeto consumidor com harness na raiz (WebQA Suite como padrão externo)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

# NOTA: o pacote de negócio NÃO depende de webqa-suite no core.
# A suíte é um concern de QA, declarada com pin exato apenas em requirements-qa.txt.
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/governance"]
pythonpath = ["src"]
