# Visão de produto: o problema, os usuários e as métricas de sucesso (IDs estáveis MET-*).
# Os requisitos do backlog citam quais métricas movem — o fiscal cobra que a métrica exista.
# Schema: harness/schemas/vision.schema.json
schema_version: "1.0"
metadata_version: "1.0"
source_of_truth: true
generated_from: null

product:
  problem: "Problema de negócio que o produto resolve (a definir pelo projeto real)."
  target_users:
    - "perfil-principal"
  value_proposition: "Resultado mensurável esperado."
  success_metrics:
    - id: MET-ACTIVATION
      description: "Percentual de usuários que concluem a jornada inicial de compra."
      target: ">= 60%"
    - id: MET-AOV
      description: "Valor médio do pedido (average order value)."
      target: "crescente trimestre a trimestre"
    - id: MET-DISCOVERY
      description: "Percentual de usuários que navegam o catálogo antes de comprar."
      target: ">= 40%"
