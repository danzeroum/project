  - id: RISK-EXT-001
    area: access
    description: "Sem autoridade externa, a verificação de proteção mora no repositório fiscalizado: um PR privilegiado remove o passo e a asserção que o vigia no mesmo commit."
    likelihood: low
    impact: high
    treatment: mitigate
    owner: security_owner
    # MITIGADO em 05/08/2026 (CP-036), e antes do prazo de 03/11 que a aceitação tinha marcado.
    # O que fechou não foi código novo — o código estava escrito desde a CP-024. Foi a autoridade
    # passar a EXISTIR, e a evidência é citável em vez de prometida:
    #
    #   - `danzeroum/harness-authority`: verificador em repositório que este aqui não alcança —
    #     nenhum workflow, token ou PR deste lado o edita;
    #   - GitHub App próprio (identidade emissora que não é o GITHUB_TOKEN deste repositório);
    #   - ruleset de tags `tags-imoveis` ativo, com deletion + non_fast_forward + update e bypass
    #     VAZIO, mais o ruleset da `main` — a configuração real do servidor, lida de fora;
    #   - atestado real na árvore (`harness/state/protection-attestation.json`), com validade de
    #     25h: uma execução perdida do cron o faz EXPIRAR em vez de continuar valendo;
    #   - `external_audit.enabled: true`, com `authorized_issuer` conferido a cada execução.
    #
    # `mitigate`, não `closed`: restam DOIS passos administrativos fora do alcance de qualquer PR
    # deste repositório, e ambos são de admin no GitHub:
    #
    #   1. tornar o check da autoridade OBRIGATÓRIO no ruleset da `main` — é o que separa "o CI
    #      reprova" de "o merge é impossível";
    #   2. habilitar o auto-merge nativo (Settings → General → Pull Requests → Allow auto-merge),
    #      sem o qual o PR diário do atestado permanece manual (CP-037/ADR-029). O fallback é o
    #      estado anterior, não um pior: o passo falha com a instrução exata no log.
    #
    # Fechar o risco enquanto eles não existem seria carimbar a parte que falta. Sem `due` porque
    # `mitigate` não é `open`: não há prazo a vencer, há um estado a melhorar — e os ADR-028 e
    # ADR-029 dizem qual.
    status: mitigated
    controls:
      - kind: local_path
        ref: ci/verify_protection.py
      - kind: local_path
        ref: harness/schemas/protection-attestation.schema.json
      - kind: local_path
        ref: harness/state/protection-attestation.json
      - kind: local_path
        ref: harness/policies/trava-externa.md
      - kind: local_path
        ref: architecture/adr/ADR-020-camada-local-nao-equivale-a-externa.md
      - kind: local_path
        ref: architecture/adr/ADR-028-a-autoridade-externa-ligada.md
      - kind: local_path
        ref: ci/automerge_gate.py
      - kind: local_path
        ref: architecture/adr/ADR-029-o-atestado-e-o-unico-conteudo-auto-mergeavel.md
      - kind: branch_protection
        ref: "main:require_pull_request_reviews"
      - kind: branch_protection
        ref: "refs/tags/v*:tags-imoveis"

  - id: RISK-CHANGE-002
    area: governance
    description: "Não há revisor humano independente: o único colaborador é também o autor de todas as change-proposals e dos PRs que as integram. `human_approval_required: true` declara que o aval era necessário, e ele não foi prestado por ninguém além de quem propôs."
    likelihood: high
    impact: medium
    treatment: accept
    owner: security_owner
    status: open
    # Mesma data do RISK-EXT-001, de propósito: as duas lacunas fazem a mesma pergunta — existe,
    # fora deste repositório, uma autoridade que não seja quem é fiscalizado? Revisá-las juntas
    # evita que a segunda seja esquecida por ter calendário próprio. Em 03/11/2026: ou existe
    # revisor independente e as CPs fecham pelo caminho direto, ou o risco é RE-ACEITO com data
    # nova. O schema exige `due` de risco `open`, então a data é trava e não convenção.
    due: "2026-11-03"
    controls:
      - kind: local_path
        ref: ci/verify_approval.py
      - kind: local_path
        ref: harness/policies/ciclo-de-vida-da-cp.md
      - kind: local_path
        ref: architecture/adr/ADR-027-aval-ausente-e-lacuna-declarada.md
      - kind: branch_protection
        ref: "main:require_pull_request_reviews"

  - id: RISK-INCUBA-001
    area: governance
    description: "A promessa 'o vermelho é o mapa' (ADR-019) não tem mecanismo para um derivado em incubação. `lifecycle: incubating` só é consultado por `audit_governance.py::check_stage_coverage`; as invariantes de ingestão de `validate_metadata` (órfão, teste órfão, regra, REQ, I4, I5) e o `audit_lgpd` não o consultam. Enquanto a ingestão não termina, mapa e defeito têm exatamente a mesma cor, e cabe a cada derivado inventar a diferença."
    likelihood: high
    impact: medium
    treatment: accept
    owner: technical_owner
    status: open
    # Medido, não suposto: `danzeroum/projectCockpitDocker` virou o primeiro derivado a consumir a
    # v1.0.0 e ficou com 299 achados — dos quais 209 são o mapa de componentes e testes que a
    # ingestão ainda vai autorar. Ele resolveu por conta própria, com uma catraca que recusa SUBIDA
    # e CATEGORIA NOVA contra um baseline versionado. Funciona; e uma promessa que cada derivado
    # reimplementa não é do molde.
    #
    # Três respostas possíveis, com custos diferentes, e é por isso que esta CP declara em vez de
    # decidir: (a) silenciar as invariantes durante a incubação, como check_stage_coverage faz —
    # barato e amplo demais, esconderia regressão junto com dívida; (b) rebaixá-las a severidade
    # não-bloqueante — mantém visível e perde o gate; (c) adotar a catraca como mecanismo do molde
    # — a única que não afrouxa fiscal nenhum, e a mais cara.
    #
    # Mesma data do RISK-EXT-001 e do RISK-CHANGE-002, pela razão de sempre: calendário próprio é
    # como um risco é esquecido sozinho.
    due: "2026-11-03"
    controls:
      - kind: local_path
        ref: harness/change-proposals/CP-038-tres-achados-do-primeiro-derivado.yaml
      - kind: local_path
        ref: architecture/adr/ADR-019-vermelho-durante-mudanca-e-mapa.md

risk_exemptions: []
