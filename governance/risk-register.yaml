# Registro de riscos: classifica quanto risco existe numa mudança antes de agir.
# Schema: harness/schemas/risk-register.schema.json
# controls[] são referências TIPADAS — nem todo controle é arquivo local.
schema_version: "1.0"
metadata_version: "1.0"
source_of_truth: true
generated_from: null

risks:
  - id: RISK-WEBQA-001
    area: webqa
    description: "Sondagem ativa realizada sem autorização externa."
    likelihood: low
    impact: high
    treatment: prevent
    owner: security_owner
    status: mitigated
    controls:
      - kind: local_path
        ref: harness/policies/execution-modes.md
      - kind: local_path
        ref: .github/workflows/qa.yml
      - kind: standard_symbol
        standard: webqa-suite
        version_source: requirements-qa.txt
        ref: "webqa/gates.py::require_discovery"
      - kind: github_environment
        ref: production
      - kind: local_path
        ref: architecture/adr/ADR-001-webqa-como-padrao-externo.md

  - id: RISK-DEP-001
    area: dependencies
    description: "Atualização automática altera a régua de auditoria sem revisão."
    likelihood: medium
    impact: high
    treatment: prevent
    owner: technical_owner
    status: mitigated
    controls:
      - kind: local_path
        ref: requirements-qa.txt
      - kind: local_path
        ref: harness/policies/dependency-updates.md
      - kind: branch_protection
        ref: "main:require_pull_request_reviews"
      - kind: local_path
        ref: architecture/adr/ADR-003-versao-em-fonte-unica.md

  - id: RISK-META-001
    area: governance
    description: "Metadado declarado sem fiscal deriva do repositório real e mente em silêncio."
    likelihood: medium
    impact: medium
    treatment: mitigate
    owner: technical_owner
    status: mitigated
    controls:
      - kind: local_path
        ref: ci/validate_metadata.py
      - kind: local_path
        ref: .github/workflows/validate-metadata.yml
      - kind: local_path
        ref: architecture/adr/ADR-002-enforcement-nao-em-markdown.md

  - id: RISK-CHANGE-001
    area: governance
    description: "Agente aplica mudança de alto risco sem declaração de impacto nem aval humano."
    likelihood: medium
    impact: high
    treatment: prevent
    owner: security_owner
    status: mitigated
    controls:
      - kind: local_path
        ref: harness/schemas/change-proposal.schema.json
      - kind: local_path
        ref: ci/validate_metadata.py
      - kind: local_path
        ref: harness/policies/change-proposals.md
      - kind: local_path
        ref: architecture/adr/ADR-004-mudanca-proposta-declarada.md

  # ------------------------------------------------------------------------------------
  # Divergência entre governança e código, e privacidade. Os fiscais destes riscos são eles
  # próprios controles local_path: remover um fiscal quebra check_risk_controls e o registro
  # deixa de fechar. É assim que "divergência vira risco" sem que ferramenta alguma escreva
  # num arquivo source_of_truth.
  # ------------------------------------------------------------------------------------

  - id: RISK-CONF-001
    area: governance
    description: "Código evolui e diverge de decisão arquitetural aceita; o ADR vira prosa e o CI não percebe."
    likelihood: medium
    impact: high
    treatment: prevent
    owner: technical_owner
    status: mitigated
    controls:
      - kind: local_path
        ref: ci/audit_governance.py
      - kind: local_path
        ref: architecture/adr/index.yaml
      - kind: local_path
        ref: harness/schemas/adr-index.schema.json
      - kind: local_path
        ref: harness/policies/conformance.md
      - kind: local_path
        ref: architecture/adr/ADR-006-conformidade-como-assercao.md
      - kind: branch_protection
        ref: "main:require_pull_request_reviews"

  - id: RISK-STAGE-001
    area: governance
    description: "Etapa do projeto sem fiscal resolvível: a cobertura é afirmada, nunca verificada."
    likelihood: medium
    impact: medium
    treatment: mitigate
    owner: technical_owner
    status: mitigated
    controls:
      - kind: local_path
