      - kind: local_path
        ref: .github/CODEOWNERS
      - kind: branch_protection
        ref: "main:require_pull_request_reviews"

  - id: RISK-PRIV-001
    area: data
    description: "Dado pessoal tratado fora do inventário: campo com forma de PII sem finalidade, base legal ou retenção declaradas."
    likelihood: medium
    impact: high
    treatment: prevent
    owner: security_owner
    status: mitigated
    controls:
      - kind: local_path
        ref: ci/audit_lgpd.py
      - kind: local_path
        ref: governance/data-inventory.yaml
      - kind: local_path
        ref: harness/schemas/data-inventory.schema.json
      - kind: local_path
        ref: harness/policies/lgpd.md
      - kind: local_path
        ref: architecture/adr/ADR-007-lgpd-sempre-em-dois-niveis.md

  - id: RISK-PRIV-002
    area: data
    description: "Julgamento de privacidade ausente ou desatualizado: RIPD/parecer que não cobre o estado atual do sistema."
    likelihood: medium
    impact: high
    treatment: prevent
    owner: security_owner
    status: mitigated
    controls:
      - kind: local_path
        ref: governance/privacy-review.yaml
      - kind: local_path
        ref: governance/ripd.md
      - kind: local_path
        ref: harness/schemas/privacy-review.schema.json
      - kind: local_path
