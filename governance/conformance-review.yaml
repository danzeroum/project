# Registro TIPADO da validação semântica. Irmão de privacy-review.yaml, e pela mesma razão:
# o fiscal determinístico não julga se uma descrição ainda condiz com o código — ele confere que
# alguém julgou e que o julgamento cobre ESTE estado (scope_fingerprint, que inclui o SHA do alvo).
#
# Atualizar o fingerprint: python ci/audit_conformance.py --print-fingerprint
# Schema: harness/schemas/conformance-review.schema.json
schema_version: "1.0"
metadata_version: "1.0"
source_of_truth: true
generated_from: null

review:
  produced_by: agent
  agent: conformance
  scope_fingerprint: "sha256:f43cb3bb76ab68e41f13dfcb4c482cc44c77259714344892119a0270389ba02d"

  findings:
    - id: CONF-001
      severity: low
      summary: >
        O negócio de exemplo (CAP-PRICING, CAP-CATALOG e seus componentes) descreve um domínio
        de brinquedo, não um sistema real. Num molde isso é correto; num derivado seria metadado
        mentindo sobre o que o repositório governa.
      disposition: accepted
      rationale: >
        É o substrato mínimo que faz as asserções do ADR-005 morderem: sem src/project/pricing.py
        e src/project/ports.py, import_required e import_forbidden viram assertion_unresolvable, e
        o ADR-006 deixa de ter prova de que a conformidade executa. O CP-000 do /adotar remove
        esse negócio no derivado e supersede o ADR-005 no mesmo movimento — separá-los deixaria
        o repositório vermelho no meio.

    - id: CONF-002
      severity: low
      summary: >
        A area 'availability' do enum de riscos segue sem nenhum risco que a use, mesmo depois da
        Fase E ter sido criada justamente para expor lacunas de cobertura.
      disposition: accepted
      rationale: >
        Este repositório é um molde sem runtime: não há serviço, SLO nem error budget sobre o que
        um risco de disponibilidade pudesse falar. Criar um aqui produziria exatamente o que a
        Fase E combate — cobertura de fachada, um risco escrito para o enum não ficar vazio. A
        lacuna é real e pertence ao derivado que governar um alvo com runtime; deixá-la registrada
        aqui é o oposto de escondê-la.

    - id: CONF-003
      severity: medium
      summary: >
        O adapter de TypeScript não resolve alias de workspace, re-export em cadeia nem import
        dinâmico, então o check de dependência declarada é cego para parte do acoplamento real
        de um monorepo TS.
      disposition: accepted
      rationale: >
        Decisão registrada no ADR-009: adotar dependency-cruiser faria este molde, Python puro,
        exigir toolchain de Node para fiscalizar qualquer alvo — inclusive alvos sem Node. A perda
        é declarada no laudo do inventário em vez de ficar invisível, que é a diferença entre um
        fiscal que não sabe e um que finge saber. Reverter a decisão exige ADR novo, não silêncio.

    - id: CONF-004
      severity: medium
      summary: >
        THREAT-PRICING-INFO é mitigada por 'accepted' com a razão de que este molde não tem
        runtime. A ameaça é real e continua real no derivado: um alvo com serviço herda o
        vazamento por traceback e a mitigação aceita aqui não vale lá.
      disposition: risk_entry
      ref: RISK-SEC-001
      rationale: >
        Registrada como herança explícita em vez de resolvida: mitigar aqui exigiria inventar um
        log de produção que não existe, e uma mitigação de fachada é pior que a herança declarada.
        O /adotar leva a ameaça ao derivado, onde ela tem alvo real; RISK-SEC-001 carrega o dono.

  # O que esta revisão NÃO olhou. "Sem achados" numa categoria que ninguém examinou é a forma
  # mais silenciosa de laudo falso.
  not_assessed:
    - "Conformidade do código do alvo (não há alvo: este repositório é kind:mold)"
    - "Adequação das fronteiras de componente propostas pelo cartographer (sem ingestão executada)"
    - "Eficácia real dos controles em produção (não há ambiente de produção)"
    - "Se os prazos de tratamento de risco são razoáveis (nenhum risco está open)"
