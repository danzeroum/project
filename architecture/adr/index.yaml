  - id: ADR-007
    title: "Análise de LGPD sempre ligada, em dois níveis com fronteira explícita"
    status: accepted
    file: architecture/adr/ADR-007-lgpd-sempre-em-dois-niveis.md
    related_risks:
      - RISK-PRIV-001
      - RISK-PRIV-002
    assertions:
      - id: ADR-007-A1
        kind: path_present
        severity: critical
        risk: RISK-PRIV-002
        description: "Os dois níveis existem: o fiscal determinístico e o contrato do julgamento."
        paths:
          - ci/audit_lgpd.py
          - governance/data-inventory.yaml
          - governance/privacy-review.yaml
          - governance/ripd.md
          - harness/agents/privacy/AGENT.md
          - harness/prompts/lgpd-task.md
      - id: ADR-007-A2
        kind: schema_lock
        severity: critical
        risk: RISK-PRIV-001
        description: "classification voltou a ser opcional? Então lgpd_relevance nunca mais reprova."
        file: harness/schemas/project.schema.json
        pointer: /required
        contains: classification
      - id: ADR-007-A3
        kind: schema_lock
        severity: critical
        risk: RISK-PRIV-001
        description: "Art. 11: a base legal de dado sensível não admite legítimo interesse nem proteção ao crédito."
        file: harness/schemas/data-inventory.schema.json
        pointer: /$defs/base_legal_art_11/enum
        expected:
          - consentimento
          - obrigacao_legal
          - politicas_publicas
          - estudo_orgao_pesquisa
          - exercicio_direitos_processo
          - protecao_vida
          - tutela_saude
          - prevencao_fraude_seguranca
      - id: ADR-007-A4
        kind: schema_lock
        severity: critical
        risk: RISK-PRIV-001
        description: "Art. 41: papel de tratador segue exigindo encarregado indicado."
        file: harness/schemas/data-inventory.schema.json
        pointer: /properties/controller/allOf/0/then/required
        contains: dpo_contact
      - id: ADR-007-A5
        kind: file_matches
        severity: critical
        risk: RISK-PRIV-002
        description: "A análise de LGPD roda no CI, sem filtro de paths — 'sempre' quer dizer sempre."
        files: [".github/workflows/governance.yml"]
        pattern: "ci/audit_lgpd\\.py"
      - id: ADR-007-A6
        kind: manual
        severity: medium
        risk: RISK-PRIV-002
        description: "Adequação da base legal à finalidade e proporcionalidade da retenção."
        justification: >
          Juízo jurídico, não verificável por máquina: se a base legal declarada é adequada à
          finalidade, se o prazo de retenção é proporcional (Art. 6º, I e III) e se um campo não
          sinalizado pela heurística é ainda assim dado pessoal. Fica com a skill /revisao-lgpd,
          e o resultado é registrado em governance/privacy-review.yaml, cujo frescor o fiscal
          determinístico cobra a cada push.

  - id: ADR-008
    title: "O derivado declara o alvo, nunca o copia; e nenhum alvo é especial"
    status: accepted
    file: architecture/adr/ADR-008-derivado-declara-o-alvo.md
    related_risks: [RISK-DERIV-001, RISK-DERIV-002]
    assertions:
      - id: ADR-008-A1
        kind: path_present
        severity: high
        risk: RISK-DERIV-001
        description: "O caminho de entrada e a âncora do alvo existem: sem eles, 'colar um link' volta a ser prosa."
        paths:
          - BOOTSTRAP.md
          - target.lock
          - .claude/commands/adotar.md
          - harness/schemas/target-lock.schema.json
          - ci/adoption_status.py
      - id: ADR-008-A2
        kind: schema_lock
        severity: critical
        risk: RISK-DERIV-001
        description: "Derivado sem bloco target continua sendo recusado pelo schema, não pelo bom senso."
        file: harness/schemas/project.schema.json
        pointer: /allOf/0/then/required
        contains: target
      - id: ADR-008-A3
        kind: schema_lock
        severity: critical
        risk: RISK-DERIV-001
        description: "A âncora do SHA segue apontando para target.lock — fonte única, como a versão da régua."
        file: harness/schemas/project.schema.json
        pointer: /properties/target/properties/lock_source/const
        expected: target.lock
      - id: ADR-008-A4
        kind: file_lacks
        severity: high
        risk: RISK-DERIV-001
        description: "SHA de commit do alvo fora de target.lock: segunda cópia de uma versão deriva e a comparação passa a mentir."
        files: ["project.yaml"]
        pattern: "\\b[0-9a-f]{40}\\b"
      - id: ADR-008-A5
        kind: file_lacks
        severity: high
        risk: RISK-DERIV-002
        description: "Alvo cravado no molde: URL de repositório em ci/ ou harness/ faz o molde servir a um alvo e falhar calado nos outros."
        files: ["ci/**/*.py", "harness/**/*.yaml", "harness/**/*.json", "harness/**/*.md"]
        pattern: "github\\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"

