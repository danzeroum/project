  - id: ADR-005
    title: "Catálogo via porta (Protocol) e adaptador; precificação depende da porta"
    status: accepted
    file: architecture/adr/ADR-005-catalogo-via-porta.md
    related_capabilities:
      - CAP-CATALOG
    related_components:
      - CMP-CATALOG
      - CMP-PRICING
    assertions:
      # O elo que faltava: o ADR-005 decide inversão de dependência, mas até aqui nada
      # impedia pricing.py de importar o adaptador concreto. A2 é essa trava.
      - id: ADR-005-A1
        kind: import_required
        severity: high
        risk: RISK-CONF-001
        description: "A precificação depende da PORTA — o contrato, não uma implementação."
        module_glob: "src/project/pricing.py"
        symbols: ["project.ports.CatalogoProdutos"]
      - id: ADR-005-A2
        kind: import_forbidden
        severity: high
        risk: RISK-CONF-001
        description: "A precificação nunca toca o adaptador concreto — é o que a decisão significa."
        module_glob: "src/project/pricing.py"
        symbols: ["project.ports.CatalogoEmMemoria"]
      - id: ADR-005-A3
        kind: import_forbidden
        severity: medium
        risk: RISK-CONF-001
        description: "A porta não depende do consumidor: sem ciclo entre domínio e contrato."
        module_glob: "src/project/ports.py"
        symbols: ["project.pricing"]
      - id: ADR-005-A4
        kind: file_matches
        severity: high
        risk: RISK-CONF-001
        description: "A porta continua sendo um Protocol, não uma classe concreta rebatizada."
        files: ["src/project/ports.py"]
        pattern: "class\\s+CatalogoProdutos\\(Protocol\\)"
      - id: ADR-005-A5
        kind: path_present
        severity: medium
        risk: RISK-CONF-001
        description: "O teste que a seção Fiscal do ADR nomeia existe de fato."
        paths: ["tests/unit/test_pricing.py"]

  - id: ADR-006
    title: "Conformidade declarada como asserção executável; etapa sem fiscal é achado"
