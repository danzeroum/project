      - RISK-STAGE-001
    assertions:
      - id: ADR-006-A1
        kind: path_present
        severity: high
        risk: RISK-CONF-001
        description: "O fiscal de conformidade, sua política e o contrato do laudo existem."
        paths:
          - ci/audit_governance.py
          - harness/policies/conformance.md
          - harness/schemas/audit-report.schema.json
      - id: ADR-006-A2
        kind: schema_lock
        severity: high
        risk: RISK-CONF-001
        description: "Declarar o inverificável continua possível — kind manual não foi removido."
        file: harness/schemas/adr-index.schema.json
        pointer: /$defs/assertion/properties/kind/enum
        contains: manual
      - id: ADR-006-A3
        kind: schema_lock
        severity: high
        risk: RISK-CONF-001
        description: "Asserção manual segue exigindo justificativa — inverificável sem motivo é omissão."
