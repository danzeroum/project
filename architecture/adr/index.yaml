      - id: ADR-011-A4
        kind: file_lacks
        severity: medium
        risk: RISK-ALIGN-001
        description: "Nenhuma segunda escala de criticidade de capacidade: duas escalas divergem sem que nada reprove."
        files: ["harness/schemas/capabilities.schema.json"]
        pattern: '"criticality"'
      - id: ADR-011-A5
        kind: file_matches
        severity: critical
        risk: RISK-ALIGN-001
        description: "O alinhamento roda no CI a cada push, junto dos demais fiscais."
        files: [".github/workflows/governance.yml"]
        pattern: "alignment_report\\.py"

  - id: ADR-012
    title: "Verificação e validação são coisas distintas, e o agente que valida nunca corrige"
    status: accepted
    file: architecture/adr/ADR-012-conformidade-continua.md
    related_risks: [RISK-CONF-002, RISK-DERIV-001]
    assertions:
      - id: ADR-012-A1
        kind: path_present
        severity: high
        risk: RISK-CONF-002
        description: "O fiscal de frescor, o registro da validação e o contrato do agente existem."
        paths:
          - ci/audit_conformance.py
          - governance/conformance-review.yaml
          - harness/agents/conformance/AGENT.md
          - harness/policies/conformidade-continua.md
      - id: ADR-012-A2
        kind: schema_lock
        severity: high
        risk: RISK-CONF-002
        description: "Aceitar um achado segue exigindo razão registrada — aceitar em silêncio é como um achado morre."
        file: harness/schemas/conformance-review.schema.json
        pointer: /properties/review/properties/findings/items/allOf/0/then/required
        contains: rationale
      - id: ADR-012-A3
        kind: file_matches
        severity: critical
        risk: RISK-DERIV-001
        description: "O fingerprint de conformidade continua incluindo o SHA do alvo — sem ele a revisão se declara fresca sobre um sistema que mudou."
        files: ["ci/harness_lib.py"]
        pattern: '"target\.lock",'
      - id: ADR-012-A4
        kind: file_matches
        severity: high
        risk: RISK-CONF-002
        description: "O canal de retorno ao alvo continua nascendo desligado."
        files: ["harness/harness.yaml"]
        pattern: "open_issues_on_target: false"
      - id: ADR-012-A5
        kind: manual
        severity: medium
        risk: RISK-CONF-002
        description: "Qualidade do julgamento semântico do agente de conformidade."
        justification: >
          Se a descrição de um componente ainda condiz com o código, e se um ADR aceito continua
          verdadeiro em espírito, são leituras — não checagens. Nenhum fiscal determinístico as
          faz, e fingir que faria seria a versão executável de markdown que não morde. O que a
          máquina cobra é o frescor e a forma: que a revisão exista, cubra este estado (incluindo
          o SHA do alvo), encaminhe cada achado e declare o que não avaliou.

  - id: ADR-013
    title: "Segurança é departamento com artefato e fiscal, não um campo security_owner"
    status: accepted
    file: architecture/adr/ADR-013-seguranca-como-departamento.md
    related_components: [CMP-PRICING, CMP-CATALOG]
    related_risks: [RISK-SEC-001, RISK-DEP-001]
    assertions:
      - id: ADR-013-A1
        kind: path_present
        severity: high
        risk: RISK-SEC-001
        description: "O departamento existe como artefato, não como intenção."
        paths:
          - security/threat-model.yaml
          - security/dependencies.yaml
          - harness/policies/seguranca.md
      - id: ADR-013-A2
        kind: schema_lock
        severity: critical
        risk: RISK-SEC-001
        description: "Ameaça segue exigindo mitigação e residual rastreável — sem eles o modelo é lista de preocupações."
        file: harness/schemas/threat-model.schema.json
        pointer: /properties/threats/items/required
        contains: residual_risk
      - id: ADR-013-A3
        kind: schema_lock
        severity: high
        risk: RISK-SEC-001
        description: "Ameaça sem nenhuma mitigação continua estruturalmente impossível."
        file: harness/schemas/threat-model.schema.json
        pointer: /properties/threats/items/properties/mitigations/minItems
        expected: 1
      - id: ADR-013-A4
        kind: schema_lock
        severity: high
        risk: RISK-DEP-001
        description: "Dependência inventariada segue exigindo dono e razão: sem eles o inventário é uma lista de nomes."
        file: harness/schemas/dependencies.schema.json
        pointer: /properties/dependencies/items/required
        contains: owner
      - id: ADR-013-A5
        kind: manual
        severity: medium
        risk: RISK-SEC-001
        description: "Completude do modelo de ameaças em relação ao sistema real."
        justification: >
          Nenhum fiscal descobre a ameaça que ninguém pensou. O modelo é escrito por gente, e o
          que a máquina garante é que a ameaça PENSADA não fica sem mitigação, sem residual e sem
          dono. Um scanner que "gerasse" o modelo produziria julgamento de máquina com aparência
          de análise humana — a pior combinação possível neste repositório.

