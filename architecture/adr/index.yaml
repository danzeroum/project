  - id: ADR-007
    title: "Análise de LGPD sempre ligada, em dois níveis com fronteira explícita"
    status: accepted
    file: architecture/adr/ADR-007-lgpd-sempre-em-dois-niveis.md
    related_risks:
      - RISK-PRIV-001
      - RISK-PRIV-002
    assertions:
      - id: ADR-007-A1
        kind: path_present
        severity: critical
        risk: RISK-PRIV-002
        description: "Os dois níveis existem: o fiscal determinístico e o contrato do julgamento."
        paths:
          - ci/audit_lgpd.py
          - governance/data-inventory.yaml
          - governance/privacy-review.yaml
          - governance/ripd.md
          - harness/agents/privacy/AGENT.md
          - harness/prompts/lgpd-task.md
      - id: ADR-007-A2
        kind: schema_lock
        severity: critical
        risk: RISK-PRIV-001
        description: "classification voltou a ser opcional? Então lgpd_relevance nunca mais reprova."
        file: harness/schemas/project.schema.json
        pointer: /required
        contains: classification
      - id: ADR-007-A3
        kind: schema_lock
        severity: critical
        risk: RISK-PRIV-001
        description: "Art. 11: a base legal de dado sensível não admite legítimo interesse nem proteção ao crédito."
        file: harness/schemas/data-inventory.schema.json
        pointer: /$defs/base_legal_art_11/enum
        expected:
          - consentimento
          - obrigacao_legal
          - politicas_publicas
          - estudo_orgao_pesquisa
          - exercicio_direitos_processo
          - protecao_vida
          - tutela_saude
          - prevencao_fraude_seguranca
      - id: ADR-007-A4
        kind: schema_lock
        severity: critical
        risk: RISK-PRIV-001
        description: "Art. 41: papel de tratador segue exigindo encarregado indicado."
        file: harness/schemas/data-inventory.schema.json
        pointer: /properties/controller/allOf/0/then/required
        contains: dpo_contact
      - id: ADR-007-A5
        kind: file_matches
        severity: critical
        risk: RISK-PRIV-002
        description: "A análise de LGPD roda no CI, sem filtro de paths — 'sempre' quer dizer sempre."
        files: [".github/workflows/governance.yml"]
        pattern: "ci/audit_lgpd\\.py"
      - id: ADR-007-A6
        kind: manual
        severity: medium
        risk: RISK-PRIV-002
        description: "Adequação da base legal à finalidade e proporcionalidade da retenção."
        justification: >
          Juízo jurídico, não verificável por máquina: se a base legal declarada é adequada à
          finalidade, se o prazo de retenção é proporcional (Art. 6º, I e III) e se um campo não
          sinalizado pela heurística é ainda assim dado pessoal. Fica com a skill /revisao-lgpd,
          e o resultado é registrado em governance/privacy-review.yaml, cujo frescor o fiscal
          determinístico cobra a cada push.

  - id: ADR-008
    title: "O derivado declara o alvo, nunca o copia; e nenhum alvo é especial"
    status: accepted
    file: architecture/adr/ADR-008-derivado-declara-o-alvo.md
    related_risks: [RISK-DERIV-001, RISK-DERIV-002]
    assertions:
      - id: ADR-008-A1
        kind: path_present
        severity: high
        risk: RISK-DERIV-001
        description: "O caminho de entrada e a âncora do alvo existem: sem eles, 'colar um link' volta a ser prosa."
        paths:
          - BOOTSTRAP.md
          - target.lock
          - .claude/commands/adotar.md
          - harness/schemas/target-lock.schema.json
          - ci/adoption_status.py
      - id: ADR-008-A2
        kind: schema_lock
        severity: critical
        risk: RISK-DERIV-001
        description: "Derivado sem bloco target continua sendo recusado pelo schema, não pelo bom senso."
        file: harness/schemas/project.schema.json
        pointer: /allOf/0/then/required
        contains: target
      - id: ADR-008-A3
        kind: schema_lock
        severity: critical
        risk: RISK-DERIV-001
        description: "A âncora do SHA segue apontando para target.lock — fonte única, como a versão da régua."
        file: harness/schemas/project.schema.json
        pointer: /properties/target/properties/lock_source/const
        expected: target.lock
      - id: ADR-008-A4
        kind: file_lacks
        severity: high
        risk: RISK-DERIV-001
        description: "SHA de commit do alvo fora de target.lock: segunda cópia de uma versão deriva e a comparação passa a mentir."
        files: ["project.yaml"]
        pattern: "\\b[0-9a-f]{40}\\b"
        mutation:
          op: injetar_texto
          alvo: project.yaml
          texto: "# sha vazado para fora do lock: 0123456789abcdef0123456789abcdef01234567"
      - id: ADR-008-A6
        kind: file_matches
        severity: critical
        risk: RISK-DERIV-002
        description: "ESTE repositório é o molde: adotar dentro dele, em vez de derivar dele, apaga o genérico sem que trava alguma perceba."
        files: ["project.yaml"]
        pattern: '^\s*kind:\s*"mold"\s*$'
      - id: ADR-008-A5
        kind: file_lacks
        severity: high
        risk: RISK-DERIV-002
        description: "Alvo cravado no molde: URL de repositório em ci/ ou harness/ faz o molde servir a um alvo e falhar calado nos outros."
        # harness/**/*.py entrou no CP-041, e a razão é um buraco que a extração abriu: o motor de
        # mutação saiu de ci/ para harness/suite-contract/, e Python sob harness/ não era coberto
        # por nenhum dos quatro globs. Mover código de um diretório vigiado para um não-vigiado é
        # exatamente o gesto que esta asserção existe para impedir — e ela quase deixou de ver o
        # arquivo que a mudança criou.
        files: ["ci/**/*.py", "harness/**/*.py", "harness/**/*.yaml", "harness/**/*.json", "harness/**/*.md"]
        pattern: "github\\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"

        mutation:
          op: injetar_texto
          alvo: ci/audit_governance.py
          texto: "# alvo cravado no fiscal: github.com/exemplo/alvo-especifico"
  - id: ADR-009
    title: "Código sem metadado não existe, e ignorância de linguagem é declarada"
    status: accepted
    file: architecture/adr/ADR-009-codigo-sem-metadado-nao-existe.md
    related_components: [CMP-PRICING, CMP-CATALOG]
    related_risks: [RISK-INGEST-001, RISK-DERIV-002]
    assertions:
      - id: ADR-009-A1
        kind: path_present
        severity: high
        risk: RISK-INGEST-001
        description: "O inventário e o registro de adapters existem: sem eles a invariante do código órfão é prosa."
        paths:
          - ci/inventory_code.py
          - ci/adapters/__init__.py
          - ci/adapters/generico.py
          - harness/policies/code-metadata.md
      - id: ADR-009-A2
        kind: schema_lock
        severity: high
        risk: RISK-INGEST-001
        description: "Isenção de código segue exigindo justificativa — isenção muda é onde pendência dorme."
        file: harness/schemas/components.schema.json
        pointer: /properties/exemptions/items/required
        contains: justification
      - id: ADR-009-A3
        kind: file_matches
        severity: high
        risk: RISK-DERIV-002
        description: "O adapter genérico casa qualquer extensão: linguagem sem leitor semântico não pode sair verde por vacuidade."
        files: ["ci/adapters/generico.py"]
        pattern: 'extensions=\("\*",\)'
      - id: ADR-009-A4
        kind: file_lacks
        severity: high
        risk: RISK-DERIV-002
        description: "O prefixo src/ não volta a ser literal no fiscal: convenção cravada torna o molde específico de um alvo."
        files: ["ci/validate_metadata.py"]
        pattern: 'startswith\("src/"\)'
        mutation:
          op: injetar_texto
          alvo: ci/validate_metadata.py
          texto: "_ = \"\".startswith(\"src/\")  # raiz cravada"
      - id: ADR-009-A6
        kind: file_matches
        severity: critical
        risk: RISK-INGEST-001
        description: "A aritmética de completude continua verificada a cada arquivo: especificador lido e não classificado é aresta engolida, e engolir foi como 84 arestas de um alvo real sumiram."
        files: ["ci/inventory_code.py"]
        pattern: "conta_fecha\\(\\)"
      - id: ADR-009-A5
        kind: file_matches
        severity: critical
        risk: RISK-INGEST-001
        description: "A invariante do código órfão roda no CI a cada push, junto dos demais fiscais."
        files: [".github/workflows/governance.yml"]
        pattern: "codigo orfao|código órfão"

  - id: ADR-010
    title: "A ingestão declara de onde tirou cada coisa, e não julga o que tirou"
    status: accepted
    file: architecture/adr/ADR-010-ingestao-com-proveniencia.md
    related_risks: [RISK-INGEST-001, RISK-INGEST-002]
    assertions:
      - id: ADR-010-A1
        kind: path_present
        severity: high
        risk: RISK-INGEST-002
        description: "O pipeline, seu schema e o contrato do cartographer existem — sem eles a ingestão volta a ser improviso."
        paths:
          - harness/pipeline/ingest.yaml
          - harness/schemas/ingest-pipeline.schema.json
          - harness/agents/cartographer/AGENT.md
          - harness/policies/ingestao.md
      - id: ADR-010-A2
        kind: schema_lock
        severity: critical
        risk: RISK-INGEST-002
        description: "Proveniência segue exigindo o SHA: sem ele o metadado descreve um alvo que já mudou."
        file: harness/schemas/capabilities.schema.json
        pointer: /properties/capabilities/items/properties/derived_from/required
        contains: sha
      - id: ADR-010-A3
        kind: schema_lock
        severity: high
        risk: RISK-INGEST-002
        description: "Toda fase da ingestão segue obrigada a declarar fiscal e gate."
        file: harness/schemas/ingest-pipeline.schema.json
        pointer: /properties/phases/items/required
        contains: fiscal
      - id: ADR-010-A4
        kind: file_matches
        severity: high
        risk: RISK-INGEST-002
        description: "O cartographer continua proibido de preencher julgamento — é o que separa cartografar de decidir."
        files: ["harness/agents/cartographer/AGENT.md"]
        pattern: "pending_judgment"
      - id: ADR-010-A5
        kind: manual
        severity: medium
        risk: RISK-INGEST-001
        description: "Adequação da fronteira de componente proposta ao domínio real do alvo."
        justification: >
          Agrupar arquivos em componentes é julgamento de domínio, não dedução: nenhum fiscal
          decide se packages/auth e packages/session são um componente ou dois. O fiscal cobra
          pertencimento, proveniência e ausência de julgamento automático; a adequação da fronteira
          fica com a revisão humana da change-proposal, onde o erro é visível no diff com a
          proveniência ao lado.

