# Índice fiscalizável dos ADRs. Os arquivos .md são a prosa; este índice é o que o CI verifica:
# arquivo existe, status válido, referências (CAP/RISK/ADR) resolvem — e as ASSERÇÕES passam.
#
# A seção "## Fiscal" de cada ADR nomeia o fiscal em prosa. assertions[] é a mesma coisa numa
# forma que ci/audit_governance.py EXECUTA. Sem isso, "o código deve depender da porta" é uma
# frase que ninguém verifica; com isso, é um passo de CI que fica vermelho.
# Schema: harness/schemas/adr-index.schema.json
schema_version: "1.0"
metadata_version: "1.0"
source_of_truth: true
generated_from: null

adrs:
  - id: ADR-001
    title: "Consumir a WebQA Suite como padrão externo, nunca copiado"
    status: accepted
    file: architecture/adr/ADR-001-webqa-como-padrao-externo.md
    related_risks:
      - RISK-WEBQA-001
    assertions:
      - id: ADR-001-A1
        kind: path_absent
        severity: critical
        risk: RISK-WEBQA-001
        description: "A régua nunca existe no consumidor: webqa/, checks/ e a lista curada."
        paths:
          - webqa
          - checks
          - data/caminhos-sensiveis.yaml
      - id: ADR-001-A2
        kind: file_matches
        severity: critical
        risk: RISK-WEBQA-001
        description: "O passo de CI que recusa régua copiada continua existindo."
        files: [".github/workflows/qa.yml"]
        pattern: "name:\\s*Recusar régua copiada"
      - id: ADR-001-A3
        kind: file_matches
        severity: critical
        risk: RISK-WEBQA-001
        description: "O passo ainda enumera os TRÊS alvos — remover um da lista é desligar a trava."
        files: [".github/workflows/qa.yml"]
        pattern: "for alvo in webqa checks data/caminhos-sensiveis\\.yaml"
      - id: ADR-001-A4
        kind: file_lacks
        severity: high
        risk: RISK-DEP-001
        description: "O pin é exato: nenhuma faixa de versão para webqa-suite."
        files: ["requirements-qa.txt"]
        pattern: "^\\s*webqa-suite\\s*[<>~!]="

        mutation:
          op: injetar_texto
          alvo: requirements-qa.txt
          texto: "webqa-suite>=1.0.0  # faixa em vez de pin exato"
  - id: ADR-002
    title: "Enforcement mora em schema, CI e gates — não em markdown"
    status: accepted
    file: architecture/adr/ADR-002-enforcement-nao-em-markdown.md
    related_risks:
      - RISK-META-001
    assertions:
      - id: ADR-002-A1
        kind: path_present
        severity: critical
        risk: RISK-META-001
        description: "Os fiscais estruturais e semânticos existem como código, não como promessa."
        paths:
          - ci/validate_metadata.py
          - .github/workflows/validate-metadata.yml
          - harness/schemas/harness.schema.json
      - id: ADR-002-A2
        kind: file_matches
        severity: high
        risk: RISK-META-001
        match: all
        exclude: ["harness/policies/README.md"]
        description: "Toda política aponta para seu fiscal — o próprio README diz que entrada sem apontamento é lembrete, não garantia."
        files: ["harness/policies/*.md"]
        pattern: "^Fiscalizado por:"
      - id: ADR-002-A3
        kind: path_present
        severity: high
        risk: RISK-CONF-001
        description: "Os fiscais de comportamento e o manifesto de etapas existem."
        paths:
          - ci/audit_governance.py
          - ci/audit_lgpd.py
          - harness/stages.yaml

  - id: ADR-003
    title: "Versão do padrão em fonte única e procedência carimbada"
    status: accepted
    file: architecture/adr/ADR-003-versao-em-fonte-unica.md
    related_capabilities:
      - CAP-PRICING
    related_risks:
      - RISK-DEP-001
    assertions:
      - id: ADR-003-A1
        kind: schema_lock
        severity: high
        risk: RISK-DEP-001
        description: "O schema fixa ONDE a versão mora, e não admite restatá-la."
        file: harness/schemas/project.schema.json
        pointer: /properties/quality_standard/properties/version_source/const
        expected: requirements-qa.txt
      - id: ADR-003-A2
        kind: schema_lock
        severity: high
        risk: RISK-DEP-001
        description: "additionalProperties:false em quality_standard é o que impede acrescentar 'version:'."
        file: harness/schemas/project.schema.json
        pointer: /properties/quality_standard/additionalProperties
        expected: false
      - id: ADR-003-A3
        kind: schema_lock
        severity: high
        risk: RISK-DEP-001
        description: "A procedência continua exigindo o hash da lista curada — é o que revela régua editada."
        file: harness/schemas/provenance.schema.json
        pointer: /properties/standard/required
        contains: sensitive_paths_hash
      - id: ADR-003-A4
        kind: file_lacks
        severity: high
        risk: RISK-DEP-001
        description: "project.yaml não restata a versão do padrão: nenhum semver de três partes."
        files: ["project.yaml"]
        pattern: "\\b[0-9]+\\.[0-9]+\\.[0-9]+\\b"

        mutation:
          op: injetar_texto
          alvo: project.yaml
          texto: "# versao restatada indevidamente: 1.2.3"
  - id: ADR-004
