          - harness/schemas/harness.schema.json
      - id: ADR-002-A2
        kind: file_matches
        severity: high
        risk: RISK-META-001
        match: all
        exclude: ["harness/policies/README.md"]
        description: "Toda política aponta para seu fiscal — o próprio README diz que entrada sem apontamento é lembrete, não garantia."
