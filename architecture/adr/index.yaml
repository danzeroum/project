        severity: critical
        risk: RISK-PRIV-001
        description: "O item 5 do RIPD registra a exceção do ledger: mudar uma medida de proteção declarada sem tocar no documento que a declara é o que este repositório recusa em toda parte."
        files: ["governance/ripd.md"]
        pattern: "ledger\\.jsonl.*versionado|versionado a partir do CP-026"
        dotall: true
      - id: ADR-021-A6
        kind: file_matches
        severity: high
        risk: RISK-PRIV-001
        description: "A exceção do .gitignore é de UM arquivo, e continua comentada com o motivo."
        files: [".gitignore"]
        pattern: "^!harness/state/ledger\\.jsonl$"

  - id: ADR-022
    title: "Agente sem template é fronteira sem leitor"
    status: accepted
    file: architecture/adr/ADR-022-agente-sem-template-e-fronteira-sem-leitor.md
    related_risks: [RISK-META-001, RISK-ORIENT-001]
    assertions:
      - id: ADR-022-A1
        kind: file_matches
        severity: high
        risk: RISK-META-001
        description: "O fiscal bidirecional continua existindo — sem ele, agente sem template e template-fantasma voltam a passar."
        files: ["ci/audit_governance.py"]
        pattern: "def check_agent_prompt_pairing\\("
      - id: ADR-022-A2
        kind: path_present
        severity: high
        risk: RISK-META-001
        description: "Todo agente declarado tem template de tarefa como arquivo real."
        paths:
          - harness/prompts/developer-task.md
          - harness/prompts/documenter-task.md
          - harness/prompts/cartographer-task.md
          - harness/prompts/conformance-task.md
          - harness/prompts/lgpd-task.md
          - harness/prompts/review-task.md
          - harness/prompts/tester-task.md
      - id: ADR-022-A3
        kind: file_matches
        severity: high
        risk: RISK-META-001
        description: "A doc de schemas continua com --check dentro da validação total: doc que pode envelhecer sem custo envelhece, e passa a mentir com autoridade de documentação (R-11)."
        files: ["ci/validate_all.py"]
        pattern: "generate_schema_docs\\.main, \\[\"--check\"\\]"
      - id: ADR-022-A4
        kind: file_matches
        severity: medium
        risk: RISK-ORIENT-001
        description: "Prontidão continua sendo MODO do orientador, e não script separado (R-10)."
        files: ["ci/orient.py"]
        pattern: "def pronto\\("
      - id: ADR-022-A5
        kind: path_absent
        severity: medium
        risk: RISK-ORIENT-001
        description: "Nenhum script separado de prontidão reapareceu: duplicar o que orient.py sabe foi rejeitado, e a duplicata errava o caminho do lock."
        paths:
          - ci/verificar_pronto.py
          - ci/check_ready.py

  - id: ADR-023
    title: "Duração de CI nunca é gate; paridade local é"
    status: accepted
    file: architecture/adr/ADR-023-duracao-de-ci-nunca-e-gate.md
    related_risks: [RISK-DEP-001, RISK-META-001]
    assertions:
      - id: ADR-023-A1
        kind: path_present
        severity: high
        risk: RISK-DEP-001
        description: "O lockfile do ambiente dos fiscais e o script de paridade local existem."
        paths:
          - requirements-ci.txt
          - harness/local_validate.sh
      - id: ADR-023-A2
        kind: file_matches
        severity: critical
        risk: RISK-DEP-001
        description: "Toda linha do lockfile carrega hash — sem isso o cache poderia esconder dependência adulterada."
        files: ["requirements-ci.txt"]
        pattern: "--hash=sha256:[0-9a-f]{64}"
      - id: ADR-023-A3
        kind: file_matches
        severity: critical
        risk: RISK-DEP-001
        description: "O CI continua instalando com verificação de hash: restore falho nunca vira artefato de fiscal."
        files: [".github/workflows/governance.yml"]
        pattern: "pip install --require-hashes -r requirements-ci\\.txt"
      - id: ADR-023-A4
        kind: file_matches
        severity: high
        risk: RISK-DEP-001
        description: "O local instala do MESMO lockfile e com a MESMA exigência de hash — é o que faz 'passa aqui' significar 'passa lá'."
        files: ["harness/local_validate.sh"]
        pattern: "--require-hashes --quiet -r requirements-ci\\.txt"
      - id: ADR-023-A5
        kind: file_matches
        severity: high
        risk: RISK-DEP-001
        description: "A chave do cache inclui o lockfile: uma chave que ignorasse o lock serviria um ambiente que não corresponde ao declarado."
        files: [".github/workflows/governance.yml"]
        pattern: "hashFiles\\('requirements-ci\\.txt'\\)"
      - id: ADR-023-A6
        kind: file_matches
        severity: high
        risk: RISK-META-001
        description: "O mapa de remediação por origem continua existindo — achado sem o que fazer transfere ao leitor o trabalho de descobrir."
        files: ["ci/harness_lib.py"]
        pattern: "REMEDIACAO_POR_ORIGEM"
      - id: ADR-023-A7
        kind: file_lacks
        severity: high
        risk: RISK-META-001
        description: "Nenhum threshold de duração voltou como gate (R-12): o workflow não compara tempo de execução com número algum."
        files: [".github/workflows/governance.yml"]
        pattern: "(duration|elapsed|SECONDS).*(-lt|-gt|<|>)\\s*[0-9]+"
        mutation:
          op: injetar_texto
          alvo: .github/workflows/governance.yml
          texto: "          # if [ \"$SECONDS\" -gt 300 ]; then exit 1; fi"
      - id: ADR-023-A8
        kind: file_lacks
        severity: medium
        risk: RISK-META-001
        description: "O checklist de PR continua fora da validação total: ele é ergonomia, não o nono fiscal."
        files: ["ci/validate_all.py"]
        pattern: "pr_checklist"

  - id: ADR-024
    title: "Toda trava prova que morde"
    status: accepted
    file: architecture/adr/ADR-024-toda-trava-prova-que-morde.md
    related_risks: [RISK-CONF-001, RISK-DEP-001]
    assertions:
      - id: ADR-024-A1
        kind: path_present
        severity: critical
        risk: RISK-CONF-001
        description: "A prova de mutação e o fiscal de conflito de dependências existem como código."
        paths:
          - ci/audit_mutations.py
          - ci/check_dependency_conflict.py
      - id: ADR-024-A2
        kind: file_matches
        severity: critical
        risk: RISK-CONF-001
        description: "A prova continua sendo passo do CI — sem ela, uma asserção pode virar decorativa sem que nada acuse."
        files: [".github/workflows/governance.yml"]
        pattern: "python ci/audit_mutations\\.py"
      - id: ADR-024-A3
        kind: file_matches
        severity: high
        risk: RISK-CONF-001
        description: "A mutação continua sendo VERIFICADA, não assumida: o fiscal exige que a asserção fique vermelha depois de aplicá-la."
        files: ["ci/audit_mutations.py"]
        pattern: "nao_morde"
      - id: ADR-024-A4
        kind: schema_lock
        severity: high
        risk: RISK-CONF-001
        description: "O escape declarado continua no schema: sem ele, as dez asserções de regex expressiva não teriam como provar que mordem."
        file: harness/schemas/adr-index.schema.json
        pointer: /$defs/assertion/properties/mutation/required
        contains: op
      - id: ADR-024-A5
        kind: file_lacks
        severity: high
        risk: RISK-CONF-001
        description: "A prova continua FORA da validação total: um fiscal que torna o loop de trabalho insuportável é desligado, não obedecido."
        files: ["ci/validate_all.py"]
        pattern: "audit_mutations"
        mutation:
          op: injetar_texto
          alvo: ci/validate_all.py
          texto: "# import audit_mutations  # mutação canônica"
      - id: ADR-024-A6
        kind: file_matches
        severity: high
        risk: RISK-DEP-001
        description: "O fiscal de conflito só acusa == contra ==: um >=8 no pyproject com um ==9.1.1 no lock não se contradizem, e acusá-los seria reprovar o funcionamento normal de um lockfile."
        files: ["ci/check_dependency_conflict.py"]
        pattern: "op == \"==\""

  - id: ADR-025
    title: "O workflow cria a ref, e não pode movê-la"
    status: accepted
    file: architecture/adr/ADR-025-o-workflow-cria-a-ref-e-nao-a-move.md
    related_risks: [RISK-MOLD-001, RISK-EXT-001, RISK-CONF-001]
    assertions:
      - id: ADR-025-A1
        kind: path_present
        severity: high
        risk: RISK-MOLD-001
        description: "A decisão que revê o comentário do CP-021 existe como ADR, não como edição silenciosa de comentário."
        paths:
          - architecture/adr/ADR-025-o-workflow-cria-a-ref-e-nao-a-move.md
      - id: ADR-025-A2
        kind: file_matches
        severity: critical
        risk: RISK-MOLD-001
        description: "O caminho de publicação existe: dispatch com a versão como entrada. Sem ele, a única forma de nascer uma tag volta a ser `git tag` manual — que aponta para qualquer commit."
        files: [".github/workflows/release.yml"]
        pattern: "workflow_dispatch:"
      - id: ADR-025-A3
        kind: file_matches
        severity: critical
        risk: RISK-MOLD-001
        description: "O job de publicação tem permissão de escrita de conteúdo — sem ela o workflow não cria ref alguma e o caminho volta a ser decorativo."
        files: [".github/workflows/release.yml"]
        pattern: "contents: write"
      - id: ADR-025-A4
        kind: file_matches
        severity: critical
        risk: RISK-CONF-001
        description: "A prova de mutação é passo do caminho de release: uma versão sem ela sairia sem evidência de que as regras bloqueantes ainda bloqueavam naquele commit."
        files: [".github/workflows/release.yml"]
        pattern: "run: python ci/audit_mutations\\.py"
      - id: ADR-025-A5
        kind: file_matches
        severity: critical
        risk: RISK-MOLD-001
        description: "A ORDEM é a decisão: a prova de mutação aparece ANTES do push da ref. Validar depois de publicar é descobrir o problema com o problema já publicado."
        files: [".github/workflows/release.yml"]
        pattern: 'python ci/audit_mutations\.py[\s\S]*?git push origin "refs/tags/'
      - id: ADR-025-A6
        kind: file_matches
        severity: critical
        risk: RISK-MOLD-001
        description: "A cadeia é verificada ANTES do push da ref: o que se publica é byte a byte o que se verificou, porque é o mesmo objeto Git."
        files: [".github/workflows/release.yml"]
        pattern: 'mold_release\.py --verify-tag "\$\{TAG\}"[\s\S]*?git push origin "refs/tags/'
      - id: ADR-025-A7
        kind: file_lacks
        severity: critical
        risk: RISK-MOLD-001
        description: "Nenhum push de ref com --force neste workflow. Criar e mover são operações distintas, e a assimetria entre elas é toda a resposta à objeção do auto-atestado."
        files: [".github/workflows/release.yml"]
        pattern: "^[^#\\n]*git push[^\\n]*--force"
        mutation:
          op: injetar_texto
          alvo: .github/workflows/release.yml
          texto: '        run: git push --force origin "refs/tags/${TAG}"'
      - id: ADR-025-A8
        kind: file_matches
        severity: high
        risk: RISK-MOLD-001
        description: "A janela entre validar e criar a ref tem tranca própria, e ela é função pura — o chamador é quem tem o git."
        files: ["ci/mold_release.py"]
        pattern: "def preflight_publicacao"
      - id: ADR-025-A9
        kind: file_matches
        severity: high
        risk: RISK-MOLD-001
        description: "A release é registrada no ledger, referenciando o commit taggeado. Publicação sem registro é evento que só existe enquanto alguém lembra."
        files: [".github/workflows/release.yml"]
        pattern: "ci/audit_ledger\\.py --append release"
      - id: ADR-025-A10
        kind: file_matches
        severity: high
        risk: RISK-EXT-001
        description: "O eixo de tags da trava externa existe no mesmo fiscal da branch: são a mesma pergunta sobre dois namespaces de ref, e dependem da mesma raiz administrativa."
        files: ["ci/verify_protection.py"]
        pattern: "def verify_tag_protection"
      - id: ADR-025-A11
        kind: file_matches
        severity: high
        risk: RISK-EXT-001
        description: "O eixo de tags exige as regras que impedem MOVER e APAGAR, e não `creation`: exigir creation trancaria o único caminho legítimo de publicação."
        files: ["ci/verify_protection.py"]
        pattern: "non_fast_forward"
      - id: ADR-025-A12
        kind: file_matches
        severity: high
        risk: RISK-MOLD-001
        description: "A recusa rápida usa o MESMO regex de ci/mold_release.py::TAG_RE. Duas checagens da mesma coisa que discordam num caso de borda são um gerador de bugs: a rápida libera, a lenta recusa, e o operador descobre a discordância no pior momento."
        files: [".github/workflows/release.yml"]
        pattern: '\^v\[0-9\]\+\\\.\[0-9\]\+\\\.\[0-9\]\+\$'
      - id: ADR-025-A13
        kind: file_matches
        severity: high
        risk: RISK-MOLD-001
        description: "A recusa rápida vem ANTES do checkout — a posição é a decisão. Um caminho que faz três minutos de trabalho antes de olhar para o que o operador digitou ensina o operador a esperar."
        files: [".github/workflows/release.yml"]
        pattern: 'Recusar entrada malformada[\s\S]*?uses: actions/checkout'
      - id: ADR-025-A14
        kind: file_matches
        severity: critical
        risk: RISK-MOLD-001
        description: "O registro NASCE do commit validado e REFERENCIA o taggeado. Ancorada no NOME do passo de propósito: o mesmo detach aparece antes, ao montar o commit de release, e uma asserção que só procurasse o comando casaria com aquele e continuaria verde depois de removido este — decorativa no sentido exato do ADR-024."
        files: [".github/workflows/release.yml"]
        pattern: 'Registrar a release no ledger[\s\S]*?git switch --detach "\$\{VALIDADO\}"[\s\S]*?--commit-sha "\$\{RELEASE_COMMIT\}"'

  - id: ADR-026
    title: "A árvore taggeada valida-se pela cadeia, não por validate_all"
    status: accepted
    file: architecture/adr/ADR-026-a-arvore-taggeada-valida-se-pela-cadeia.md
    related_risks: [RISK-MOLD-001, RISK-DERIV-002, RISK-CONF-001]
    assertions:
      - id: ADR-026-A1
        kind: path_present
        severity: high
        risk: RISK-MOLD-001
        description: "A decisão sobre o que 'validado' significa numa árvore que carrega o manifesto existe como ADR, não como hábito do workflow."
        paths:
          - architecture/adr/ADR-026-a-arvore-taggeada-valida-se-pela-cadeia.md
      - id: ADR-026-A2
        kind: file_matches
        severity: critical
        risk: RISK-MOLD-001
        description: "A ORDEM do job auditar: a cadeia é verificada ENQUANTO a tag está montada (--verify-tag lê o manifesto do disco) e a validação total roda depois, no PAI — a árvore para a qual ela é a pergunta certa."
        files: [".github/workflows/release.yml"]
        pattern: 'Verificar a cadeia da release[\s\S]*?git switch --detach "\$pai"[\s\S]*?run: python ci/validate_all\.py'
      - id: ADR-026-A3
        kind: file_lacks
        severity: critical
        risk: RISK-DERIV-002
        description: "Não existe mais caminho que produza run_url no manifesto. Não é 'proibido escrever' — é inexpressável, mesma formulação da CP-026, porque proibição depende de alguém lembrar. O schema segue aceitando o campo, para que o registro histórico da v1.0.0 continue válido."
        files: ["ci/mold_release.py"]
        pattern: "run_url"
      - id: ADR-026-A4
        kind: file_lacks
        severity: high
        risk: RISK-DERIV-002
        description: "O workflow não passa --run-url: a URL do run é derivável de repository + run_id, e carregá-la no manifesto tornaria a árvore publicada indefensável sob o ADR-008-A5."
        files: [".github/workflows/release.yml"]
        pattern: "--run-url"
      - id: ADR-026-A5
        kind: dir_allowlist
        severity: critical
        risk: RISK-MOLD-001
        description: "O manifesto não entra na árvore validada — cláusula própria, para reprovar pelo MOTIVO e não por efeito colateral do ADR-008-A5. É dir_allowlist e não path_absent com glob porque rel_exists é literal: o glob nunca casaria, e a mutação canônica criaria um arquivo com o nome literal do glob, fazendo a prova de mutação certificar uma trava decorativa."
        dir: harness/releases
        allow: ["README.md"]
      - id: ADR-026-A6
        kind: file_lacks
        severity: critical
        risk: RISK-DERIV-002
        description: "O ADR-008-A5 não foi afrouxado para acomodar manifestos: nenhum `exclude:` dentro do bloco dele. Afrouxar um fiscal para o CI passar é a terceira opção, e é a errada."
        files: ["architecture/adr/index.yaml"]
        # Ancorado em INÍCIO DE LINHA, e não é detalhe: a primeira versão deste padrão casou com a
        # PRÓPRIA declaração — o texto do padrão contém `id: ADR-008-A5` seguido de `exclude:` na
        # mesma linha, e o temperamento por `\n      - id: ` não protege dentro de uma linha só.
        pattern: '^      - id: ADR-008-A5$(?:(?!\n      - id: )[\s\S])*?exclude:'
        mutation:
          op: injetar_apos
          alvo: architecture/adr/index.yaml
          marcador: "id: ADR-008-A5"
          texto: '        exclude: ["harness/releases/*.manifest.json"]'

  - id: ADR-027
    title: "Aval humano ausente é lacuna declarada, não status inventado"
    status: accepted
    file: architecture/adr/ADR-027-aval-ausente-e-lacuna-declarada.md
    related_risks: [RISK-CHANGE-002, RISK-CHANGE-001]
    assertions:
      - id: ADR-027-A1
        kind: path_present
        severity: high
        risk: RISK-CHANGE-002
        description: "A decisão de não forjar o aval existe como ADR — doze propostas visivelmente não fechadas, com o motivo escrito, valem mais que doze `executed` cujo aval ninguém prestou."
        paths:
          - architecture/adr/ADR-027-aval-ausente-e-lacuna-declarada.md
      - id: ADR-027-A2
        kind: file_matches
        severity: critical
        risk: RISK-CHANGE-002
        description: "A lacuna do aval independente é risco ABERTO e COM DATA. O schema já exige `due` de risco `open`; esta asserção prova que o risco não foi silenciosamente fechado ou removido para o registro parecer limpo."
        files: ["governance/risk-register.yaml"]
        pattern: '^  - id: RISK-CHANGE-002$(?:(?!\n  - id: )[\s\S])*?due: "'
      - id: ADR-027-A3
        kind: file_matches
        severity: critical
        risk: RISK-CHANGE-002
        description: "O verify_approval continua rodando no CI: no dia em que alguém marcar uma CP `executed`, o aval é resolvido contra a API, não contra a boa-fé de quem escreveu o YAML."
        files: [".github/workflows/governance.yml"]
        pattern: "python ci/verify_approval\\.py"
      - id: ADR-027-A4
        kind: file_matches
        severity: critical
        risk: RISK-CHANGE-002
        description: "A recusa de auto-aprovação (Fraude 3) continua no código. É a asserção que mais importa: quando doze propostas `approved` parecerem trabalho inacabado, a tentação não será conseguir o revisor que falta — será apagar a checagem que o exige."
        files: ["ci/verify_approval.py"]
        pattern: "é o autor do PR"

  - id: ADR-028
    title: "A autoridade externa está ligada, e o emissor é conferido"
    status: accepted
    file: architecture/adr/ADR-028-a-autoridade-externa-ligada.md
    related_risks: [RISK-EXT-001, RISK-META-002]
    assertions:
      - id: ADR-028-A1
        kind: path_present
        severity: high
        risk: RISK-EXT-001
        description: "A decisão de ligar a camada externa existe como ADR — inclusive o que ela deliberadamente NÃO faz (tornar o check obrigatório no ruleset da main), para que a lacuna restante não seja confundida com esquecimento."
        paths:
          - architecture/adr/ADR-028-a-autoridade-externa-ligada.md
      - id: ADR-028-A2
        kind: file_matches
        severity: critical
        risk: RISK-EXT-001
        description: "A camada externa está LIGADA. A mutação canônica não apaga a linha — apagá-la produziria erro de schema, que é outro estado com outra reação. Ela escreve `false`, que é o gesto real de quem desliga a autoridade e permanece válido perante o schema."
        files: ["harness/harness.yaml"]
        pattern: '^external_audit:$(?:(?!\n[a-z_]+:)[\s\S])*?\n  enabled: true$'
        mutation:
          op: substituir_texto
          alvo: harness/harness.yaml
          de: "\n  enabled: true"
          para: "\n  enabled: false"
      - id: ADR-028-A3
        kind: schema_lock
        severity: critical
        risk: RISK-META-002
        description: "Ligada EXIGE emissor declarado. A combinação 'exijo atestado e aceito qualquer um' é pior que a camada desligada — desligada a lacuna está escrita e datada; ligada-sem-emissor ela fica escondida atrás de um JSON que quem tem direito de merge escreve à mão. O schema a torna inexpressável em vez de proibida."
        file: harness/schemas/harness.schema.json
        pointer: /properties/external_audit/allOf/0/then/required
        contains: authorized_issuer
      - id: ADR-028-A4
        kind: file_matches
        severity: critical
        risk: RISK-META-002
        description: "A comparação de emissor continua no fiscal, e compara IDENTIDADE contra a autoridade declarada. Sem ela, o atestado certificaria a si mesmo: qualquer arquivo com a forma certa passaria, e quem teria motivo para escrevê-lo é exatamente quem tem direito de merge."
        files: ["ci/audit_governance.py"]
        pattern: 'emissor\.get\("identity"\) != autorizado\.get\("identity"\)'
      - id: ADR-028-A5
        kind: file_matches
        severity: critical
        risk: RISK-META-002
        description: "O achado de emissor é PRÓPRIO e não colapsa com os outros dois (princípio (h)): ausente é 'o verificador não entregou', expirado é 'ele entregou e envelheceu', emissor errado é 'alguém escreveu isto à mão'. Os dois primeiros são falha de operação; o terceiro é uma acusação, e um EXT-AUDIT-INVALIDO genérico destruiria a informação que diz qual investigar."
        files: ["ci/audit_governance.py"]
        pattern: "EXT-AUDIT-EMISSOR-NAO-AUTORIZADO"
      - id: ADR-028-A6
        kind: path_present
        severity: critical
        risk: RISK-EXT-001
        description: "Com a camada ligada, o atestado está na árvore. Removê-lo não deixa o repositório em silêncio — deixa em vermelho, porque ausente vale o mesmo que expirado: é o preço declarado de depender de um cron que este repositório não controla."
        paths:
          - harness/state/protection-attestation.json

  - id: ADR-029
    title: "O atestado é o único conteúdo auto-mergeável, e o portão não julga os checks"
    status: accepted
    file: architecture/adr/ADR-029-o-atestado-e-o-unico-conteudo-auto-mergeavel.md
    related_risks: [RISK-EXT-001, RISK-META-002]
    assertions:
      - id: ADR-029-A1
        kind: path_present
        severity: high
        risk: RISK-EXT-001
        description: "A decisão de dispensar o clique — e SÓ o clique — existe como ADR, com a janela calculada e o passo de admin que ela não alcança."
        paths:
          - architecture/adr/ADR-029-o-atestado-e-o-unico-conteudo-auto-mergeavel.md
          - ci/automerge_gate.py
          - .github/workflows/atestado-automerge.yml
      - id: ADR-029-A2
        kind: file_matches
        severity: critical
        risk: RISK-META-002
        description: "O gatilho é `pull_request_target`, e essa linha é a segurança inteira: com `pull_request` o YAML executado viria do head, e as checagens que decidem se o PR pode auto-mergear seriam escritas pelo próprio PR."
        files: [".github/workflows/atestado-automerge.yml"]
        pattern: "pull_request_target"
      - id: ADR-029-A3
        kind: file_matches
        severity: critical
        risk: RISK-META-002
        description: "A ORDEM é a decisão: o portão decide ANTES de o auto-merge ser habilitado. Ancorada no NOME do passo (lição da ADR-025-A14) para que a asserção não case com qualquer menção solta ao comando."
        files: [".github/workflows/atestado-automerge.yml"]
        pattern: 'Decidir se este PR é auto-mergeável[\s\S]*?Habilitar o auto-merge NATIVO[\s\S]*?gh pr merge'
      - id: ADR-029-A4
        kind: file_matches
        severity: critical
        risk: RISK-META-002
        description: "Habilitar o auto-merge é CONDICIONAL à saída do portão. Sem o `if`, os dois passos continuariam na ordem certa e o segundo rodaria de qualquer jeito — ordem sem condição é encenação."
        files: [".github/workflows/atestado-automerge.yml"]
        pattern: "if: steps\\.portao\\.outputs\\.liberar == 'true'"
      - id: ADR-029-A5
        kind: file_lacks
        severity: critical
        risk: RISK-META-002
        description: "Nada de `--admin` neste workflow. `--auto` entrega o julgamento ao ruleset; `--admin` o atropela, e o ruleset é a única coisa deste desenho que o conteúdo de um PR não alcança."
        files: [".github/workflows/atestado-automerge.yml"]
        pattern: "--admin"
      - id: ADR-029-A6
        kind: file_matches
        severity: critical
        risk: RISK-META-002
        description: "A CHECAGEM DE DIFF, e a forma dela é a decisão: IGUALDADE contra uma lista de UM caminho, não allowlist, não prefixo, não glob. Um `startswith` teria o mesmo efeito hoje e custaria uma linha para virar `harness/` amanhã. É esta asserção que torna caro alargar o que pode auto-mergear."
        files: ["ci/automerge_gate.py"]
        pattern: 'tocados != \[caminho_atestado\]'
      - id: ADR-029-A7
        kind: file_matches
        severity: critical
        risk: RISK-META-002
        description: "A checagem de AUTOR continua no portão, e exige as duas coisas: o login derivado de `authorized_issuer` e o tipo `Bot`. O login é digitável por um humano que registre uma conta com esse nome; o tipo é atribuído pelo GitHub."
        files: ["ci/automerge_gate.py"]
        pattern: 'autor_login != esperado or autor_tipo != "Bot"'
      - id: ADR-029-A8
        kind: file_matches
        severity: critical
        risk: RISK-META-002
        description: "Indeterminação não libera: sem `authorized_issuer` ou sem `attestation_path` declarados, o portão não sabe contra o que comparar e recusa. Sem esta guarda, as duas comparações acima seriam feitas contra string vazia e liberariam por vacuidade."
        files: ["ci/automerge_gate.py"]
        pattern: "PORTAO-SEM-DECLARACAO"
      - id: ADR-029-A9
        kind: file_lacks
        severity: high
        risk: RISK-META-002
        description: "O portão não faz checkout do head do PR. Ler metadado da API é seguro; trazer o head para o runner de um job com `contents: write` é o modo de falha clássico do `pull_request_target`."
        files: [".github/workflows/atestado-automerge.yml"]
        pattern: "github\\.event\\.pull_request\\.head\\.sha"

  - id: ADR-030
    title: "Uma régua entra por ficha, nunca por código"
    status: accepted
    file: architecture/adr/ADR-030-a-regua-entra-por-ficha.md
    related_risks: [RISK-WEBQA-001, RISK-CONF-001, RISK-SEC-001]
    assertions:
      - id: ADR-030-A1
        kind: path_present
        severity: critical
        risk: RISK-WEBQA-001
        description: "O contrato, o registro, o fiscal genérico e o motor compartilhado existem como código — não como intenção."
        paths:
          - harness/suite-contract/contract-v1/SUITE_CONTRACT.md
          - harness/suite-contract/contract-v1/contract-manifest.json
          - harness/suite-contract/mutation-engine/mutation_engine.py
          - harness/suites/qa-suite.yaml
          - harness/suites/privacy-suite.yaml
          - ci/audit_suites.py
      - id: ADR-030-A2
        kind: schema_lock
        severity: critical
        risk: RISK-SEC-001
        description: "env_prefix continua OBRIGATÓRIO na ficha: sem ele, os gates fail-closed de uma régua ficam alcançáveis pelo ambiente, e a ficha passaria sem que nada acusasse."
        file: harness/schemas/suite-registry.schema.json
        pointer: /properties/suite/required
        contains: env_prefix
      - id: ADR-030-A3
        kind: schema_lock
        severity: high
        risk: RISK-META-001
        description: "contract_version continua sendo enum FECHADO: um contrato inexistente tem de ser inexpressável, não apenas detectável."
        file: harness/schemas/suite-registry.schema.json
        pointer: /properties/suite/properties/contract_version/enum
        contains: v1
      - id: ADR-030-A4
        kind: schema_lock
        severity: critical
        risk: RISK-WEBQA-001
        description: "O terceiro estado do laudo continua representável — sem `inconclusivo`, 'não consegui medir' volta a sair com a cor de 'medi e está bom'."
        file: harness/schemas/report.schema.json
        pointer: /properties/verdict/enum
        contains: inconclusivo
      - id: ADR-030-A5
        kind: schema_lock
        severity: high
        risk: RISK-CONF-001
        description: "O conjunto de cláusulas da v1 continua fechado em cinco: acrescentar uma sexta é a v2, nunca uma edição da v1 — senão o contrato muda de conteúdo sem mudar de nome."
        file: harness/schemas/suite-contract-manifest.schema.json
        pointer: /properties/contract/properties/clauses/maxItems
        expected: 5
      - id: ADR-030-A6
        kind: file_matches
        severity: critical
        risk: RISK-SEC-001
        description: "A denylist de ambiente continua DERIVANDO do registro de suites: sem isso, o prefixo de cada régua nova voltaria a depender de alguém lembrar de editar uma lista."
        files: ["ci/env_guard.py", "ci/hooks/pre_bash_env_hygiene.py"]
        pattern: "harness / \"suites\"|harness/suites/"
      - id: ADR-030-A7
        kind: file_lacks
        severity: high
        risk: RISK-DEP-001
        description: "harness.yaml não restata o prefixo de régua alguma: ele mora na ficha, e a segunda cópia derivaria da primeira."
        files: ["harness/harness.yaml"]
        pattern: "env_denylist_prefix: \\[[^]]*WEBQA_"
        mutation:
          op: substituir_texto
          alvo: harness/harness.yaml
          de: "env_denylist_prefix: []"
          para: "env_denylist_prefix: [\"WEBQA_\"]"
      - id: ADR-030-A8
        kind: file_matches
        severity: critical
        risk: RISK-CONF-001
        description: "O fiscal continua reprovando A SI MESMO quando uma cláusula chega sem mutação canônica — um fiscal que não sabe como seria negado não sabe se está funcionando."
        files: ["ci/audit_suites.py"]
        pattern: "FISCAL-SEM-AUTOPROVA"
      - id: ADR-030-A9
        kind: import_forbidden
        severity: critical
        risk: RISK-WEBQA-001
        description: "O motor compartilhado não importa harness_lib: a fronteira é de DADOS, e é o que permite a um segundo consumidor usá-lo sem receber meio molde junto."
        module_glob: "harness/suite-contract/mutation-engine/mutation_engine.py"
        symbols: ["harness_lib.Findings"]
      - id: ADR-030-A10
        kind: path_present
        severity: critical
        risk: RISK-WEBQA-001
        description: "O runner genérico e o kit de conformidade existem como código: sem eles a ficha DESCREVE e nunca EXECUTA, e um registro que ninguém executa é documentação com schema."
        paths:
          - ci/suite_runner.py
          - ci/suite_conformance.py
      - id: ADR-030-A11
        kind: file_matches
        severity: critical
        risk: RISK-WEBQA-001
        description: "O runner continua traduzindo `inconclusivo`, e não deixando o estado sumir: um verde que significa 'não olhei' encerra a investigação com a convicção de quem olhou."
        files: ["ci/suite_runner.py"]
        pattern: "def traduzir_veredito"
      - id: ADR-030-A12
        kind: file_lacks
        severity: critical
        risk: RISK-WEBQA-001
        description: "qa.yml não invoca mais a régua diretamente: o comando mora na ficha, e voltar a cravá-lo aqui faz uma régua nova custar edição de workflow outra vez."
        files: [".github/workflows/qa.yml"]
        pattern: "^\\s+webqa (inventario|auditar) --(raiz|config) [^\\n]*\\n\\s+else"
        mutation:
          op: substituir_texto
          alvo: .github/workflows/qa.yml
          de: "        run: python ci/suite_runner.py --suite qa-suite --mode inventory"
          para: "        run: |\n          if true; then\n            webqa inventario --raiz . --saida harness/reports/cockpit.html\n          else\n            echo stub\n          fi"
      - id: ADR-030-A13
        kind: file_matches
        severity: high
        risk: RISK-SEC-001
        description: "O runner executa sem shell: o argv vem separado da ficha, porque `--config $ARQUIVO` num shell deixa de ser um argumento e vira uma oportunidade."
        files: ["ci/suite_runner.py"]
        pattern: "subprocess\\.run\\(comando, cwd=hl\\.REPO"
      - id: ADR-030-A14
        kind: file_matches
        severity: critical
        risk: RISK-DEP-001
        description: "A resolução de $ref entre schemas é LOCAL: um fiscal que consulta a rede para julgar o repositório tem veredito que depende de quem responde — a mesma família de sequestro que o CP-025 fecha para pip e import."
        files: ["ci/harness_lib.py"]
        pattern: "def _registry"

  - id: ADR-031
    title: "O painel de configuração deriva dos contratos, e prova isso a cada execução"
    status: accepted
    file: architecture/adr/ADR-031-painel-de-configuracao-derivado.md
    related_risks:
      - RISK-ORIENT-001
      - RISK-META-001
    assertions:
      - id: ADR-031-A1
        kind: import_required
        severity: high
        risk: RISK-ORIENT-001
        description: "O gerador usa o leitor da casa. Sem harness_lib ele não honraria HARNESS_REPO_ROOT, e toda mordida passaria a validar a árvore de trabalho em vez da cópia mutada — provando exatamente nada."
        module_glob: "ci/generate_config_report.py"
        symbols: ["harness_lib"]
      - id: ADR-031-A2
        kind: import_forbidden
        severity: high
        risk: RISK-ORIENT-001
        description: "Nenhum leitor PARALELO do que harness_lib já lê. O escopo é a decisão: escrever JSON é permitido (json.dumps serializa o artefato), LER em paralelo não é — seriam duas leituras do mesmo repositório, e a segunda derivaria."
        module_glob: "ci/generate_config_report.py"
        symbols: ["yaml", "tomllib", "toml", "configparser", "json.load", "json.loads", "json.JSONDecoder"]
      - id: ADR-031-A3
        kind: path_present
        severity: high
        risk: RISK-META-001
        description: "O gerador, o contrato do artefato, o stylesheet declarado e os dois artefatos derivados existem como arquivo."
        paths:
          - ci/generate_config_report.py
          - ci/assets/organic.css
          - harness/schemas/config-report.schema.json
          - docs/configuracao/index.html
          - docs/configuracao/config.json
      - id: ADR-031-A4
        kind: file_matches
        severity: critical
        risk: RISK-ORIENT-001
        description: "A autoauditoria continua no lugar. É ela, e não uma asserção de texto, que impede a transcrição: um arquivo que fala sobre vocabulário fechado contém as palavras do assunto em toda parte, e procurar no texto cru ancoraria na menção."
        files: ["ci/generate_config_report.py"]
        pattern: "^def _vocabulario_nao_esta_no_codigo\\("
        mutation:
          op: apagar_padrao
          alvo: ci/generate_config_report.py
          pattern: "def _vocabulario_nao_esta_no_codigo\\("
      - id: ADR-031-A5
        kind: file_lacks
        severity: high
        risk: RISK-META-001
        description: "O artefato abre offline: nada nele busca recurso na rede. Um painel que depende de rede para renderizar some quando a rede some — e some em silêncio, porque a página ainda abre."
        files: ["docs/configuracao/index.html"]
        pattern: "@import|<(?:link|script|img|iframe)[^>]*\\b(?:src|href)\\s*=\\s*[\"']?(?:https?:)?//"
        # O inverso de um file_lacks com alternação não é derivável mecanicamente, e uma regra
        # bloqueante que não sabe provar que morde é decorativa. A mutação canônica é o gesto real:
        # alguém acrescenta uma folha de estilo remota ao painel, ele continua abrindo, e some em
        # silêncio no dia em que a rede não responder.
        mutation:
          op: injetar_texto
          alvo: docs/configuracao/index.html
          texto: "<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Caprasimo\">"
      - id: ADR-031-A6
        kind: schema_lock
        severity: high
        risk: RISK-META-001
        description: "O estado 'não consegui ler' continua existindo como valor nomeado no contrato. É o único dos três estados de vazio que jamais pode sair como exit 0, e apagá-lo faria coleção ilegível e coleção vazia saírem iguais na tela."
        file: harness/schemas/config-report.schema.json
        pointer: /$defs/razao_ilegivel/const
        expected: "não consegui ler"
      - id: ADR-031-A7
        kind: manual
        severity: medium
        risk: RISK-ORIENT-001
        description: "Nenhuma asserção de TEXTO procura valores de vocabulário dentro do gerador."
        justification: >
          Seria a próxima ocorrência da âncora-na-menção registrada em harness/policies/conformance.md
          como família reincidente — nove ocorrências, a última nascida dentro do fiscal escrito para
          vigiar as anteriores. Um gerador que fala SOBRE vocabulário fechado contém as palavras do
          assunto em toda parte, inclusive nos comentários que explicam por que ele não deve conter os
          VALORES, e _regex_assert lê o arquivo cru. A verificação real é
          _vocabulario_nao_esta_no_codigo, que lê o AST — onde comentário não existe — e roda a cada
          execução do gerador, portanto é gate via validate_all. A asserção A4 prova que ela continua
          no lugar, e a mutação declarada nela prova que a remoção é acusada.
