  - id: ADR-015
    title: "O molde é consumido por versão, como a régua"
    status: accepted
    file: architecture/adr/ADR-015-molde-consumido-por-versao.md
    related_risks: [RISK-MOLD-001, RISK-DERIV-001]
    assertions:
      - id: ADR-015-A1
        kind: path_present
        severity: critical
        risk: RISK-MOLD-001
        description: "As peças da ancoragem existem como código e workflow, não como intenção."
        paths:
          - ci/mold_release.py
          - .github/workflows/release.yml
          - harness/schemas/release-manifest.schema.json
          - harness/releases
      - id: ADR-015-A2
        kind: schema_lock
        severity: critical
        risk: RISK-DERIV-001
        description: "A trava nos dois sentidos continua no schema: derivado EXIGE mold_release."
        file: harness/schemas/target-lock.schema.json
        pointer: /allOf/1/then/required
        contains: mold_release
      - id: ADR-015-A3
        kind: schema_lock
        severity: high
        risk: RISK-MOLD-001
        description: "manifest_sha segue obrigatório: sem o hash, a âncora cita uma tag móvel e nada mais."
        file: harness/schemas/target-lock.schema.json
        pointer: /properties/mold_release/required
        contains: manifest_sha
      - id: ADR-015-A4
        kind: schema_lock
        severity: high
        risk: RISK-MOLD-001
        description: "O manifesto só representa validação 'pass' — a categoria 'release com validação vermelha' continua inexistente."
        file: harness/schemas/release-manifest.schema.json
        pointer: /properties/release/properties/validation/properties/result/enum
        contains: pass
      - id: ADR-015-A5
        kind: file_matches
        severity: critical
        risk: RISK-MOLD-001
        description: "A release continua validando ANTES de publicar: o passo de validação total segue no workflow de release."
        files: [".github/workflows/release.yml"]
        pattern: "run:\\s*python ci/validate_all\\.py"
      - id: ADR-015-A6
        kind: file_matches
        severity: critical
        risk: RISK-MOLD-001
        description: "A verificação da cadeia continua sendo passo do workflow — publicar sem verificar seria tag sem raiz de confiança."
        files: [".github/workflows/release.yml"]
        pattern: "ci/mold_release\\.py --verify-tag"
      - id: ADR-015-A7
        kind: file_lacks
        severity: high
        risk: RISK-MOLD-001
        description: "verify_chain continua sem I/O: nenhuma chamada de rede, git ou disco dentro da função pura que decide se a cadeia é íntegra. O padrão é temperado — só percorre da assinatura até o próximo 'def' de topo, senão acusaria o I/O legítimo da camada de CLI."
        files: ["ci/mold_release.py"]
        pattern: "def verify_chain\\((?:(?!\\ndef )[\\s\\S])*?(?:subprocess\\.|urlopen|requests\\.|\\bopen\\()"

        mutation:
          op: injetar_apos
          alvo: ci/mold_release.py
          marcador: "def verify_chain("
          texto: "    urlopen('http://exemplo')  # I/O dentro da função pura"
  - id: ADR-016
    title: "Aprovação vale para o conteúdo integrado, não para o pedido"
    status: accepted
    file: architecture/adr/ADR-016-aprovacao-vale-para-o-conteudo-integrado.md
    related_risks: [RISK-CHANGE-001, RISK-META-001]
    assertions:
      - id: ADR-016-A1
        kind: path_present
        severity: critical
        risk: RISK-CHANGE-001
        description: "O verificador de aprovação e o fiscal de ciclo existem como código."
        paths:
          - ci/verify_approval.py
          - ci/audit_friction.py
      - id: ADR-016-A2
        kind: schema_lock
        severity: critical
        risk: RISK-CHANGE-001
        description: "Executada com risco alto continua exigindo aprovador nomeado."
        file: harness/schemas/change-proposal.schema.json
        pointer: /allOf/3/then/properties/proposal/required
        contains: approved_by
      - id: ADR-016-A3
        kind: schema_lock
        severity: high
        risk: RISK-CHANGE-001
        description: "Executada continua exigindo onde: sem executed_in, a decisão não tem rastro."
        file: harness/schemas/change-proposal.schema.json
        pointer: /allOf/2/then/properties/proposal/required
        contains: executed_in
      - id: ADR-016-A4
        kind: file_matches
        severity: critical
        risk: RISK-CHANGE-001
        description: "A recusa de aprovação anterior ao último push continua no verificador — é o modo de fraude que sobrevive a um 'APPROVED' legítimo da API."
        files: ["ci/verify_approval.py"]
        pattern: "aprovação anterior ao último push"
      - id: ADR-016-A5
        kind: file_matches
        severity: high
        risk: RISK-CHANGE-001
        description: "approval_unverifiable continua com código próprio: indeterminação e fraude não podem colapsar no mesmo vermelho."
        files: ["ci/verify_approval.py"]
        pattern: "EXIT_UNVERIFIABLE = 3"
      - id: ADR-016-A6
        kind: file_lacks
        severity: high
        risk: RISK-CHANGE-001
        description: "verify_approval continua sem I/O: a conclusão que só a rede sustenta não pode nascer dentro da função pura."
        files: ["ci/verify_approval.py"]
        pattern: "def verify_approval\\((?:(?!\\ndef )[\\s\\S])*?(?:urlopen|_api\\(|requests\\.|\\bopen\\()"
        mutation:
          op: injetar_apos
          alvo: ci/verify_approval.py
          marcador: "def verify_approval("
          texto: "    urlopen('http://exemplo')  # I/O dentro da função pura"
      - id: ADR-016-A7
        kind: file_lacks
        severity: medium
        risk: RISK-META-001
        description: "O fiscal de atrito não reprova: um medidor de custo que virasse gate criaria o incentivo de não declarar propostas, destruindo o registro de onde ele tira o sinal."
        files: ["ci/audit_friction.py"]
        pattern: "^\\s*return 1\\b"

