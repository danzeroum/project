# Componentes técnicos ligados a capacidades. Fecha a rastreabilidade
# capacidade → componente → código → teste.
# Schema: harness/schemas/components.schema.json
schema_version: "1.0"
metadata_version: "1.0"
source_of_truth: true
generated_from: null

components:
  - id: CMP-PRICING
    kind: domain-module
    capability: CAP-PRICING
    status: verified
    source_paths:
      - src/project/pricing.py
    depends_on:
      - CMP-CATALOG
    exposes:
      - "project.pricing.subtotal_centavos"
      - "project.pricing.total_com_imposto_centavos"
    tested_by:
      - tests/unit/test_pricing.py
    implements:
      - REQ-001
    owner: engineering

  - id: CMP-CATALOG
    kind: port
    capability: CAP-CATALOG
    status: verified
    source_paths:
      - src/project/ports.py
    depends_on: []
    exposes:
      - "project.ports.CatalogoProdutos"
      - "project.ports.CatalogoEmMemoria"
    tested_by:
      - tests/unit/test_ports.py
    owner: engineering

# Arquivos sob as raízes de código que deliberadamente não pertencem a componente algum.
# Isenção que não casa arquivo nenhum vira achado — a mesma propriedade de stages.yaml:ungoverned,
# e é o que impede a lista de virar um lugar onde pendências dormem.
exemptions:
  - path: src/project/__init__.py
    justification: >
      Marcador de pacote: sete linhas sem lógica de negócio, cuja única função é tornar
      'project' importável. Atribuí-lo a CMP-PRICING ou a CMP-CATALOG seria escolher um dono
      arbitrário e afirmar uma relação que não existe — pior que declarar a ausência dela.
