proposal:
  id: CP-034
  title: "Semântica da árvore taggeada: valida-se pela cadeia, não por validate_all"
  author_kind: agent
  created_at: "2026-08-05T17:00:00Z"
  status: approved
  capabilities_affected: []
  components_affected: []
  paths_affected:
    - .github/workflows/release.yml
    - ci/mold_release.py
    - ci/audit_governance.py
    - ci/audit_mutations.py
    - harness/schemas/adr-index.schema.json
    - architecture/adr/index.yaml
    - architecture/adr/ADR-026-a-arvore-taggeada-valida-se-pela-cadeia.md
