proposal:
  id: CP-029
  title: "Amortecedores de mudança como asserções executáveis"
  author_kind: agent
  created_at: "2026-08-05T15:00:00Z"
  status: approved
  capabilities_affected: []
  components_affected: []
  paths_affected:
