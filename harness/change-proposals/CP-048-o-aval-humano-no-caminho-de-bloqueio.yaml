    rationale: >
      O DIAGNÓSTICO MUDOU DUAS VEZES DURANTE A INVESTIGAÇÃO, e registrar isso importa mais que o
      acerto final — uma causa plausível que explica o sintoma sem ser a causa é o modo mais caro
      de errar aqui, porque ela sobrevive ao conserto.
      PRIMEIRA HIPÓTESE, ERRADA: "a exigência não existe em lugar nenhum". Falso. O schema torna
      inexpressável declarar risco alto sem `human_approval_required: true`, e
      `check_cp_lifecycle` recusa `executed` sem `approved_by`. A parte declarativa está inteira.
      SEGUNDA HIPÓTESE, TAMBÉM ERRADA: "o fiscal existe mas não está no workflow". Falso.
      `ci/verify_approval.py` e `ci/verify_protection.py` são passos BLOQUEANTES do
      `governance.yml`, sem `continue-on-error`, e a distinção entre exit 1 e exit 3 está escrita
      com cuidado no próprio YAML.
      A CAUSA REAL, MEDIDA: `verify_approval.py` só verifica propostas cujo status já é
      `executed`. Uma proposta `approved` de risco alto — que é o estado em que TODA proposta está
      no momento em que seu PR mergeia — não é verificada por ninguém. O aval é conferido depois
      de uma transição manual que nada obriga a fazer, e antes dela o PR mergeia com zero review.
      A prova está nesta própria sessão: o PR #62 mergeou com `mergeable_state: clean` e nenhum
      aprovador, e as propostas CP-045, CP-046 e CP-047 declaram `human_approval_required: true`
      sem que nada no caminho de merge as confira.
      A SEGUNDA METADE DO BURACO: com `github.token`, a API responde 404 ao pedido de proteção da
      branch — o token não tem escopo de admin. `verify_protection` sai 3 corretamente, e o
      workflow o converte em `::warning::`. A conversão é a decisão certa (alarme de fraude por
      falta de escopo seria pior), mas o efeito composto é que NINGUÉM sabe se a exigência de
      review está ligada. Aviso que aparece toda execução é aviso que se aprende a não ler
      (ADR-019).
      O QUE ESTA PROPOSTA ENTREGA, E O QUE ELA NÃO PODE ENTREGAR. Entrega o fiscal que PROVA o
      estado em três valores — ligada, não ligada, não consegui olhar — e faz o terceiro virar
      achado DATADO em vez de aviso. Não entrega a exigência ligada: `required_pull_request_reviews`
      é configuração de admin no GitHub, fora do alcance de qualquer PR. Fingir que plugou seria
      exatamente o defeito que esta proposta existe para nomear, e por isso o resultado é um plano
      INCOMPLETO com a ação do dono escrita por extenso.
      IRMÃ DA CP-024, E COM A MESMA FORMA. Lá a camada externa faltava e virou risco aceito com
      data. Aqui a exigência de review pode estar ausente e vira risco aceito com data. Em ambos os
      casos o que se recusa é o silêncio: o estado desconhecido passa a ter um lugar onde aparecer.

