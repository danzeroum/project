  risk_assessment:
    level: medium
    risks:
      - RISK-META-001
      - RISK-SEC-001
    rationale: >
      OS DOIS SÃO A MESMA FAMÍLIA, e é isso que os junta num lote: uma trava que implementa METADE
      do enunciado que ela própria declara, e cuja metade faltante falha em SILÊNCIO — para o lado
      permissivo. Nenhum dos dois foi encontrado por leitura: o primeiro caiu num teste de borda
      pedido pela mesa, o segundo apareceu ao preencher um campo obrigatório num derivado real.

      (1) ISENÇÃO REDUNDANTE É INVISÍVEL. O schema de `risk_exemptions` declara a propriedade que
      a torna honesta: "isenção que não casa ativo algum é ela própria um achado — do contrário a
      lista vira o lugar onde a cobertura é fingida com uma linha".
      `ci/alignment_report.py::isencao_morta` implementa só o primeiro caso: `ref` que não resolve
      para ativo nenhum. MEDIDO nos dois sentidos, numa cópia do derivado: isenção apontando para
      `CMP-NAO-EXISTE` ACUSA; isenção apontando para `CMP-CERTS`, que já implementa REQ-006 e
      portanto não precisa de isenção alguma, passa em SILÊNCIO.
      Ela fica ali para sempre, protegendo nada, e o próximo leitor vê "coberto por isenção
      declarada" num componente que tem requisito de verdade. É pior que a isenção morta que o
      fiscal já pega, porque aquela é obviamente inútil e esta parece trabalho feito.
      O QUE FALTA: `isencao_morta` acusar também a isenção REDUNDANTE — `ref` de componente com
      `implements` não vazio, de superfície com `satisfies`, ou de capacidade já citada no
      `related` de algum risco. É a mesma pergunta que R1/R3/R4 já sabem responder, feita ao
      contrário.

      (2) CHAVE AUSENTE NÃO É LISTA VAZIA. `ci/hooks/pre_bash_env_hygiene.py::denied_exact` faz
      `return _politica().get("env_denylist_exact") or []`. Quando a chave falta no harness.yaml,
      o hook roda, lê lista vazia e DEIXA PASSAR — fail-open silencioso, no fiscal cuja razão de
      existir é fechar o vão entre o que morde no CI e o que morde na sessão.
      Foi medido no primeiro derivado: a chave faltava lá desde o transplante, a trava estava
      aberta, e a evidência de que ela funcionava vinha de OUTRO repositório — o hook resolve a
      raiz subindo do diretório corrente, e nas sessões em que ele recusou um `PYTHONPATH` a raiz
      resolvida era a do molde.
      A CLASSE é maior que o caso: `.get(x) or []` é o idioma que transforma "não declarado" em
      "declarado vazio" e, num fiscal, a diferença entre os dois é a diferença entre indeterminação
      e permissão. O schema já exige a chave (`required` + `minItems: 1`) — mas o schema fiscaliza
      o documento, e o hook lê o documento sem passar pelo schema.
      O QUE FALTA: `denied_exact` distinguir os três estados — chave ausente é ERRO do hook
      (exit 2, "não consegui fiscalizar"), lista vazia é declaração explícita que o schema já
      recusa, lista preenchida é o caminho normal. Mais a mordida de classe: um teste que percorra
      os leitores de política em `ci/` e recuse `\\.get\\([^)]+\\)\\s+or\\s+\\[\\]` onde o valor
      alimenta uma decisão de bloqueio.

      POR QUE FICA FORA DA v1.1.0: aquela release congela o que já estava mergeado (CP-039 e tudo
      até 5eff98b) e existe para provar que o CAMINHO repete — segunda release, mesmo preflight,
      mesma cadeia, mesmo ledger. Misturar correção nova nela trocaria a pergunta que ela responde.
      Estes dois entram no lote seguinte, com as mordidas junto.

