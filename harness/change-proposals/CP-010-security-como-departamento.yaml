      Fase E aplicada a supply chain, e vai reprovar quem acrescentar biblioteca sem passar por
      aqui — que é o efeito pretendido, não um efeito colateral.
      A segunda: threat-model.yaml não aceita ameaça sem mitigação nem sem risco residual. Uma
      ameaça catalogada e não tratada é exatamente o 'to-be-assessed' do ADR-002 vestido de
      diligência — parece trabalho de segurança e não obriga a nada. O residual_risk aponta para
      RISK-*, então a ameaça herda prazo, dono e a cobertura reversa de R2.
      Ambos os arquivos nascem sem julgamento automático: nenhuma ferramenta escreve severidade
      de ameaça, e o campo aceita pending_judgment pela mesma trava da Fase D.

