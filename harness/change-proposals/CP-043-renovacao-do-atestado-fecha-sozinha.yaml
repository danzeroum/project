proposal:
  id: CP-043
  title: "A renovação do atestado fecha sozinha: a autoridade entrega em dia e confirma que fechou"
  author_kind: agent
  created_at: "2026-08-07T04:50:00Z"
  status: approved
  capabilities_affected: []
  components_affected: []
  paths_affected:
    - architecture/adr/index.yaml
    - harness/policies/atestado-de-protecao.md
