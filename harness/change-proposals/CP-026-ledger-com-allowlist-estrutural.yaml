proposal:
  id: CP-026
  title: "Ledger append-only versionado, com allowlist estrutural em vez da promessa impossível de 'schema proíbe PII'"
  author_kind: agent
  created_at: "2026-08-05T17:00:00Z"
  status: approved
  capabilities_affected: []
  components_affected: []
  paths_affected:
    - harness/schemas/ledger.schema.json
